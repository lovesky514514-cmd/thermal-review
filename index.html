ong>拱顶、平顶<\/strong><\/td>","source":"","refs":[]},{"id":12,"kind":"陶瓷","q":"现代隧道窑的重要结构特点","a":"窑道断面优化、窑车轻质化、密封改善、温度均匀化","answerHtml":"<td><strong>窑道断面优化、窑车轻质化、密封改善、温度均匀化<\/strong><\/td>","source":"","refs":[]},{"id":13,"kind":"陶瓷","q":"隧道窑冷却带三段","a":"急冷、缓冷、快冷","answerHtml":"<td><strong>急冷、缓冷、快冷<\/strong><\/td>","source":"","refs":[]},{"id":14,"kind":"陶瓷","q":"急冷段温区（分段）","a":"700°C以上","answerHtml":"<td><strong>700°C以上<\/strong><\/td>","source":"","refs":[]},{"id":15,"kind":"陶瓷","q":"缓冷段温区（分段）","a":"700～400°C","answerHtml":"<td><strong>700～400°C<\/strong><\/td>","source":"","refs":[]},{"id":16,"kind":"陶瓷","q":"快冷段温区（分段）","a":"400°C以下","answerHtml":"<td><strong>400°C以下<\/strong><\/td>","source":"","refs":[]},{"id":17,"kind":"陶瓷","q":"窑炉运行的重要制度","a":"温度制度、压力制度、气氛制度","answerHtml":"<td><strong>温度制度、压力制度、气氛制度<\/strong><\/td>","source":"","refs":[]},{"id":18,"kind":"陶瓷","q":"电阻炉基本发热规律","a":"焦耳定律， Q = I²Rt","answerHtml":"<td><strong>焦耳定律<\/strong>，<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q<\/mi><mo>=<\/mo><msup><mi>I<\/mi><mn>2<\/mn><\/msup><mi>R<\/mi><mi>t<\/mi><\/mrow><annotation encoding=\"application/x-tex\">Q=I^2Rt<\/annotation><\/semantics><\/math><\/td>","source":"","refs":[]},{"id":19,"kind":"陶瓷","q":"电阻炉常见调功率方式","a":"通过变压器调节供电电压","answerHtml":"<td><strong>通过变压器调节供电电压<\/strong><\/td>","source":"","refs":[]},{"id":20,"kind":"陶瓷","q":"常见金属电热材料","a":"铁铬铝、镍铬、钼、钨","answerHtml":"<td><strong>铁铬铝、镍铬、钼、钨<\/strong><\/td>","source":"","refs":[]},{"id":21,"kind":"陶瓷","q":"常见非金属电热材料","a":"硅碳棒（SiC）、硅钼棒（ MoSi₂ ）","answerHtml":"<td><strong>硅碳棒（SiC）、硅钼棒（<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">M<\/mi><mi mathvariant=\"normal\">o<\/mi><mi mathvariant=\"normal\">S<\/mi><msub><mi mathvariant=\"normal\">i<\/mi><mn mathvariant=\"normal\">2<\/mn><\/msub><\/mrow><annotation encoding=\"application/x-tex\">\\mathrm{MoSi_2}<\/annotation><\/semantics><\/math>）<\/strong><\/td>","source":"","refs":[]},{"id":22,"kind":"陶瓷","q":"硅碳棒在氧化性气氛中的正常使用温度","a":"可达1450°C （对应给定条件）","answerHtml":"<td><strong>可达1450°C<\/strong>（对应给定条件）<\/td>","source":"","refs":[]},{"id":23,"kind":"陶瓷","q":"硅碳棒电阻率—温度变化","a":"先下降，达到最低值后再升高","answerHtml":"<td><strong>先下降，达到最低值后再升高<\/strong><\/td>","source":"","refs":[]},{"id":24,"kind":"陶瓷","q":"硅碳棒电阻率最低点","a":"约800～900°C附近","answerHtml":"<td><strong>约800～900°C附近<\/strong><\/td>","source":"","refs":[]},{"id":25,"kind":"陶瓷","q":"硅碳棒老化的主要后果","a":"电阻增加；定电压下电流、功率下降","answerHtml":"<td><strong>电阻增加；定电压下电流、功率下降<\/strong><\/td>","source":"","refs":[]},{"id":26,"kind":"陶瓷","q":"电阻炉面积负荷法","a":"N = K₁F","answerHtml":"<td><strong><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N<\/mi><mo>=<\/mo><msub><mi>K<\/mi><mn>1<\/mn><\/msub><mi>F<\/mi><\/mrow><annotation encoding=\"application/x-tex\">N=K_1F<\/annotation><\/semantics><\/math><\/strong><\/td>","source":"","refs":[]},{"id":27,"kind":"陶瓷","q":"电阻炉容积负荷法","a":"N = K₂V²⁄³","answerHtml":"<td><strong><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N<\/mi><mo>=<\/mo><msub><mi>K<\/mi><mn>2<\/mn><\/msub><msup><mi>V<\/mi><mrow><mn>2<\/mn><mi>/<\/mi><mn>3<\/mn><\/mrow><\/msup><\/mrow><annotation encoding=\"application/x-tex\">N=K_2V^{2/3}<\/annotation><\/semantics><\/math><\/strong><\/td>","source":"","refs":[]},{"id":28,"kind":"玻璃","q":"玻璃熔制五阶段","a":"硅酸盐形成 → 玻璃液形成 → 澄清 → 均化 → 冷却（温度调整）","answerHtml":"<td><strong>硅酸盐形成 → 玻璃液形成 → 澄清 → 均化 →\n冷却（温度调整）<\/strong><\/td>","source":"","refs":[]},{"id":29,"kind":"玻璃","q":"玻璃生产主流程","a":"配料 → 熔制 → 锡槽成型 → 退火 → 冷端切裁","answerHtml":"<td><strong>配料 → 熔制 → 锡槽成型 → 退火 → 冷端切裁<\/strong><\/td>","source":"","refs":[]},{"id":30,"kind":"玻璃","q":"玻璃熔窑燃料","a":"重油、天然气、煤气","answerHtml":"<td><strong>重油、天然气、煤气<\/strong><\/td>","source":"","refs":[]},{"id":31,"kind":"玻璃","q":"玻璃熔窑主要控制量","a":"温度、液面、泡界线、窑压、气氛","answerHtml":"<td><strong>温度、液面、泡界线、窑压、气氛<\/strong><\/td>","source":"","refs":[]},{"id":32,"kind":"玻璃","q":"温度曲线形态","a":"山形、桥形、双高峰形","answerHtml":"<td><strong>山形、桥形、双高峰形<\/strong><\/td>","source":"","refs":[]},{"id":33,"kind":"玻璃","q":"熔窑常用“四大稳”","a":"原料稳、燃料稳、熔化稳、成形稳","answerHtml":"<td><strong>原料稳、燃料稳、熔化稳、成形稳<\/strong><\/td>","source":"","refs":[]},{"id":34,"kind":"玻璃","q":"熔窑常用“四小稳”","a":"熔化温度稳、窑压稳、液面稳、泡界线稳","answerHtml":"<td><strong>熔化温度稳、窑压稳、液面稳、泡界线稳<\/strong><\/td>","source":"","refs":[]},{"id":35,"kind":"玻璃","q":"泡界线","a":"泡沫稠密区与较澄清玻璃液之间的分界线","answerHtml":"<td><strong>泡沫稠密区与较澄清玻璃液之间的分界线<\/strong><\/td>","source":"","refs":[]},{"id":36,"kind":"玻璃","q":"浮法玻璃承托介质","a":"熔融锡液","answerHtml":"<td><strong>熔融锡液<\/strong><\/td>","source":"","refs":[]},{"id":37,"kind":"玻璃","q":"玻璃带沉入锡液的近似比例","a":"厚度的1/3","answerHtml":"<td><strong>厚度的1/3<\/strong><\/td>","source":"","refs":[]},{"id":38,"kind":"玻璃","q":"玻璃带露出锡液的近似比例","a":"厚度的2/3","answerHtml":"<td><strong>厚度的2/3<\/strong><\/td>","source":"","refs":[]},{"id":39,"kind":"玻璃","q":"无拉引条件下的自由厚度","a":"约7 mm","answerHtml":"<td><strong>约7 mm<\/strong><\/td>","source":"","refs":[]},{"id":40,"kind":"玻璃","q":"某正常拉引工况的参考厚度","a":"约6 mm ；不等于所有玻璃产品厚度","answerHtml":"<td><strong>约6 mm<\/strong>；不等于所有玻璃产品厚度<\/td>","source":"","refs":[]},{"id":41,"kind":"玻璃","q":"玻璃液进入锡槽的参考温度","a":"约1100°C","answerHtml":"<td><strong>约1100°C<\/strong><\/td>","source":"","refs":[]},{"id":42,"kind":"玻璃","q":"锡槽保护气体","a":"N₂ + H₂","answerHtml":"<td><strong><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>N<\/mi><mn>2<\/mn><\/msub><annotation encoding=\"application/x-tex\">N_2<\/annotation><\/semantics><\/math>\n+\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>H<\/mi><mn>2<\/mn><\/msub><annotation encoding=\"application/x-tex\">H_2<\/annotation><\/semantics><\/math><\/strong><\/td>","source":"","refs":[]},{"id":43,"kind":"玻璃","q":"锡槽主体外形","a":"等宽型、前宽后窄型","answerHtml":"<td><strong>等宽型、前宽后窄型<\/strong><\/td>","source":"","refs":[]},{"id":44,"kind":"玻璃","q":"锡槽胸墙形式","a":"固定胸墙、活动胸墙","answerHtml":"<td><strong>固定胸墙、活动胸墙<\/strong><\/td>","source":"","refs":[]},{"id":45,"kind":"玻璃","q":"锡槽进口主要设备","a":"流道、流槽、调节闸板、安全闸板、备用闸板","answerHtml":"<td><strong>流道、流槽、调节闸板、安全闸板、备用闸板<\/strong><\/td>","source":"","refs":[]},{"id":46,"kind":"玻璃","q":"锡槽出口设备","a":"过渡辊台、密封装置","answerHtml":"<td><strong>过渡辊台、密封装置<\/strong><\/td>","source":"","refs":[]},{"id":47,"kind":"玻璃","q":"退火上限温度","a":"退火点，约对应转变温度 Tg","answerHtml":"<td><strong>退火点，约对应转变温度 Tg<\/strong><\/td>","source":"","refs":[]},{"id":48,"kind":"玻璃","q":"退火下限温度","a":"应变点，记为 Ts","answerHtml":"<td><strong>应变点，记为 Ts<\/strong><\/td>","source":"","refs":[]},{"id":49,"kind":"玻璃","q":"上限温度对应应力松弛","a":"15 min基本消除全部应力，或3 min消除95%","answerHtml":"<td><strong>15 min基本消除全部应力，或3 min消除95%<\/strong><\/td>","source":"","refs":[]},{"id":50,"kind":"玻璃","q":"下限温度对应应力松弛","a":"16 h才可消除全部应力，或3 min仅消除5%","answerHtml":"<td><strong>16 h才可消除全部应力，或3 min仅消除5%<\/strong><\/td>","source":"","refs":[]},{"id":51,"kind":"玻璃","q":"退火应力的两种分类维度","a":"端面/平面应力；暂时/永久应力","answerHtml":"<td><strong>端面/平面应力；暂时/永久应力<\/strong><\/td>","source":"","refs":[]},{"id":52,"kind":"玻璃","q":"退火窑工艺分区","a":"加热均热预退火区、A区、B区、C区、D区","answerHtml":"<td><strong>加热均热预退火区、A区、B区、C区、D区<\/strong><\/td>","source":"","refs":[]},{"id":53,"kind":"玻璃","q":"坩埚窑按火焰流向分类","a":"倒焰式、平焰式、综合焰式","answerHtml":"<td><strong>倒焰式、平焰式、综合焰式<\/strong><\/td>","source":"","refs":[]},{"id":54,"kind":"玻璃","q":"坩埚按开口形式分类","a":"开口坩埚、闭口坩埚","answerHtml":"<td><strong>开口坩埚、闭口坩埚<\/strong><\/td>","source":"","refs":[]},{"id":55,"kind":"玻璃","q":"马蹄焰池窑火焰路径","a":"U形折返，近似马蹄形","answerHtml":"<td><strong>U形折返，近似马蹄形<\/strong><\/td>","source":"","refs":[]},{"id":56,"kind":"玻璃","q":"玻璃电熔窑常用电极材料","a":"石墨、钼、氧化锡","answerHtml":"<td><strong>石墨、钼、氧化锡<\/strong><\/td>","source":"","refs":[]},{"id":57,"kind":"玻璃","q":"玻璃电熔窑电极布置形式","a":"水平棒状、垂直棒状、板状、塞状","answerHtml":"<td><strong>水平棒状、垂直棒状、板状、塞状<\/strong><\/td>","source":"","refs":[]},{"id":58,"kind":"玻璃","q":"玻璃电熔窑热源","a":"电流通过高温玻璃液产生的焦耳热","answerHtml":"<td><strong>电流通过高温玻璃液产生的焦耳热<\/strong><\/td>","source":"","refs":[]}],"definitions":[{"id":1,"q":"隧道窑","html":"<p><br/>\n一种连续式烧成设备。窑体固定，装载制品的窑车沿窑道依次经过<strong>预热带、烧成带、冷却带<\/strong>，完成烧成。<\/p>","refs":[]},{"id":2,"q":"辊道窑","html":"<p><br/>\n采用一系列旋转辊棒连续输送制品，使制品依次通过不同温区完成烧成的连续式窑炉。<\/p>","refs":[]},{"id":3,"q":"梭式窑","html":"<p><br/>\n一种间歇式烧成窑炉。窑车进出固定窑室，在同一窑室中完成<strong>升温—保温—降温<\/strong>的烧成周期。<\/p>","refs":[]},{"id":4,"q":"温度制度","html":"<p><br/>\n窑内温度随窑长或时间变化的规定，包括<strong>升温速度、最高温度、保温时间、冷却速度<\/strong>等。<\/p>","refs":[]},{"id":5,"q":"压力制度","html":"<p><br/>\n根据各温区的运行要求规定窑内压力及其分布，以控制气体流向、漏风、烟气排出和窑内气氛。<\/p>","refs":[]},{"id":6,"q":"气氛制度","html":"<p><br/>\n按产品烧成要求控制窑内气体组成及其氧化还原性质的工艺制度，常见有<strong>氧化性、还原性和中性气氛<\/strong>。<\/p>","refs":[]},{"id":7,"q":"砂封","html":"<p><br/>\n通过窑车与窑墙间设置砂槽及封砂结构阻隔窑内外气体交换的密封方式。<\/p>","refs":[]},{"id":8,"q":"曲封","html":"<p><br/>\n利用相互配合的曲折结构延长气体泄漏通道、增大流动阻力的密封方式。<\/p>","refs":[]},{"id":9,"q":"硅碳棒老化","html":"<p><br/>\n硅碳棒在长期高温使用过程中因氧化等作用发生结构与电性能变化，表现为<strong>电阻逐渐增大<\/strong>。<\/p>","refs":[]},{"id":10,"q":"电阻温度系数","html":"<p><br/>\n电阻随温度变化的相对变化率，定义为：<\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α<\/mi><mo>=<\/mo><mfrac><mn>1<\/mn><mi>R<\/mi><\/mfrac><mfrac><mrow><mi>d<\/mi><mi>R<\/mi><\/mrow><mrow><mi>d<\/mi><mi>T<\/mi><\/mrow><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">\n\\alpha=\\frac{1}{R}\\frac{dR}{dT}\n<\/annotation><\/semantics><\/math><\/p><p>其中\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α<\/mi><mo>&lt;<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">\\alpha&lt;0<\/annotation><\/semantics><\/math>\n表示升温时电阻下降，<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α<\/mi><mo>&gt;<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">\\alpha&gt;0<\/annotation><\/semantics><\/math>\n表示升温时电阻上升。<\/p>","refs":[]},{"id":11,"q":"玻璃熔制","html":"<p><br/>\n将玻璃配合料加热，使其依次经历<strong>硅酸盐形成、玻璃液形成、澄清、均化和冷却<\/strong>，获得符合成型要求玻璃液的过程。<\/p>","refs":[]},{"id":12,"q":"泡界线","html":"<p><br/>\n玻璃熔窑熔化池内<strong>泡沫稠密区与相对平静、澄清的玻璃液区域之间的明显分界线<\/strong>。泡界线位置反映熔制、流动及澄清状态。<\/p>","refs":[]},{"id":13,"q":"耳池","html":"<p><br/>\n设在熔化池末端两侧、与池体连通并向外突出的局部小池，用于<strong>加强横向对流、促进均化澄清和调整回流<\/strong>。<\/p>","refs":[]},{"id":14,"q":"浮法玻璃","html":"<p><br/>\n玻璃液流入熔融锡液表面，利用浮力、表面张力及拉引作用连续铺展成玻璃带的平板玻璃成型工艺。<\/p>","refs":[]},{"id":15,"q":"自由厚度","html":"<p><br/>\n玻璃液在锡液表面、不施加外部拉引作用时，在重力、浮力和界面张力作用下形成的平衡厚度。参考值约<strong>7\nmm<\/strong>。<\/p>","refs":[]},{"id":16,"q":"锡槽","html":"<p><br/>\n浮法玻璃成型的核心设备，槽内盛放熔融锡，玻璃液在锡液表面铺展、拉引和冷却成型。<\/p>","refs":[]},{"id":17,"q":"玻璃退火","html":"<p><br/>\n<strong>“运用适当的温度制度，适当控制温度降低速度”<\/strong>，使玻璃带中产生的应力控制在允许范围，并将残余应力降低到较低水平。<strong><\/strong><\/p>","refs":[]},{"id":18,"q":"退火上限温度（退火点）","html":"<p><br/>\n可在较短时间内使玻璃内应力基本消除的温度，约对应转变温度\n<code>Tg<\/code>。<strong>15 min消除全部应力，或3\nmin消除95%<\/strong>。<strong><\/strong><\/p>","refs":[]},{"id":19,"q":"退火下限温度（应变点）","html":"<p><br/>\n应力松弛非常缓慢的温度，记为 <code>Ts<\/code>。<strong>16\nh才能消除全部应力，或3 min仅消除5%<\/strong>。<strong><\/strong><\/p>","refs":[]},{"id":20,"q":"暂时应力","html":"<p><br/>\n玻璃在弹性温度范围内因温度梯度产生的应力；随温差消除通常可随之消失，但应力过大仍可能使玻璃破裂。<\/p>","refs":[]},{"id":21,"q":"永久应力","html":"<p><br/>\n玻璃通过退火温区时，由于冷却不均匀造成结构状态差异，并在降温过程中保留下来的残余应力。<\/p>","refs":[]},{"id":22,"q":"坩埚窑","html":"<p><br/>\n将玻璃原料置于坩埚中，由窑内热量进行玻璃熔制的窑炉，可按火焰流向和坩埚形式分类。<\/p>","refs":[]},{"id":23,"q":"马蹄焰池窑","html":"<p><br/>\n火焰从窑的一端进入、在熔池上方折返，形成近似<strong>马蹄形/U形<\/strong>流动路径的玻璃熔窑。<\/p>","refs":[]},{"id":24,"q":"玻璃电熔窑","html":"<p><br/>\n通过电极将电流引入高温导电玻璃液，利用<strong>玻璃液自身电阻产生的焦耳热<\/strong>进行熔制的玻璃窑炉。<\/p>","refs":[]}],"ceramic":[{"id":1,"q":"隧道窑的三个分带：作用与要求","html":"<table>\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>分带<\/th>\n<th>作用<\/th>\n<th>工艺要求<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>预热带<\/strong><\/td>\n<td>坯体逐渐升温，排除残余水分，进行部分脱水、分解、氧化等反应<\/td>\n<td>升温均匀；合理控制速度、排烟和气氛，防止开裂或黑心<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>烧成带<\/strong><\/td>\n<td>完成主要物理化学反应、物相转变、液相形成和烧结致密化<\/td>\n<td>控制<strong>最高温度、保温时间、气氛与温度均匀性<\/strong>，防止欠烧、过烧、变形<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>冷却带<\/strong><\/td>\n<td>烧成制品按制度降温，经过相变或热应力敏感温区，并回收部分余热<\/td>\n<td><strong>分阶段冷却<\/strong>，防止热冲击和冷却开裂，控制出窑温度<\/td>\n<\/tr>\n<\/tbody>\n<\/table><p><strong>工作流程：<\/strong>\n坯体装窑车进入预热带，经烧成带完成烧成，进入冷却带按制度降温后出窑；高温烟气流向预热带并通过排烟系统排出，部分热风可以回收利用。<strong><\/strong><\/p>","refs":[],"steps":["<table>\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>分带<\/th>\n<th>作用<\/th>\n<th>工艺要求<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>预热带<\/strong><\/td>\n<td>坯体逐渐升温，排除残余水分，进行部分脱水、分解、氧化等反应<\/td>\n<td>升温均匀；合理控制速度、排烟和气氛，防止开裂或黑心<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>烧成带<\/strong><\/td>\n<td>完成主要物理化学反应、物相转变、液相形成和烧结致密化<\/td>\n<td>控制<strong>最高温度、保温时间、气氛与温度均匀性<\/strong>，防止欠烧、过烧、变形<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>冷却带<\/strong><\/td>\n<td>烧成制品按制度降温，经过相变或热应力敏感温区，并回收部分余热<\/td>\n<td><strong>分阶段冷却<\/strong>，防止热冲击和冷却开裂，控制出窑温度<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","<p><strong>工作流程：<\/strong>\n坯体装窑车进入预热带，经烧成带完成烧成，进入冷却带按制度降温后出窑；高温烟气流向预热带并通过排烟系统排出，部分热风可以回收利用。<strong><\/strong><\/p>","<div class=\"sequence\">坯体装车 → 预热带 → 烧成带 → 冷却带 → 出窑卸车 → 排烟系统 → 热量回收<\/div>"]},{"id":2,"q":"现代隧道窑的发展趋势","html":"<p><strong>练习题：<\/strong>“结合传统隧道窑和现代隧道窑的区别，分析现代隧道窑的发展趋势。”<\/p><ol type=\"1\">\n<li><strong>窑体轻质化<\/strong>：使用轻质耐火材料、优化窑顶和窑墙结构，减少蓄热与散热损失。<\/li>\n<li><strong>窑车轻质化<\/strong>：降低窑车带走的热量，减少制品下部温度偏低的问题。<\/li>\n<li><strong>窑道断面合理化<\/strong>：优化断面高度和装载布置，改善温度场。<\/li>\n<li><strong>密封与通风改进<\/strong>：提高窑车密封效果，减少漏风和热量损失。<\/li>\n<li><strong>烧成均匀化<\/strong>：采用搅拌气幕、调温烧嘴、分区供热等方式减小温差。<\/li>\n<li><strong>节能与自动化<\/strong>：加强余热回收、测温测压、燃烧控制和自动输送。<\/li>\n<\/ol><p><strong>核心发展方向：轻质化、节能化、温度均匀化、机械化与自动化。<\/strong>\n<strong><\/strong><\/p>","refs":[],"steps":["<p><strong>练习题：<\/strong>“结合传统隧道窑和现代隧道窑的区别，分析现代隧道窑的发展趋势。”<\/p>","<div class=\"step-prose\"><div><strong>窑体轻质化<\/strong>：使用轻质耐火材料、优化窑顶和窑墙结构，减少蓄热与散热损失。<\/div><\/div>","<div class=\"step-prose\"><div><strong>窑车轻质化<\/strong>：降低窑车带走的热量，减少制品下部温度偏低的问题。<\/div><\/div>","<div class=\"step-prose\"><div><strong>窑道断面合理化<\/strong>：优化断面高度和装载布置，改善温度场。<\/div><\/div>","<div class=\"step-prose\"><div><strong>密封与通风改进<\/strong>：提高窑车密封效果，减少漏风和热量损失。<\/div><\/div>","<div class=\"step-prose\"><div><strong>烧成均匀化<\/strong>：采用搅拌气幕、调温烧嘴、分区供热等方式减小温差。<\/div><\/div>","<div class=\"step-prose\"><div><strong>节能与自动化<\/strong>：加强余热回收、测温测压、燃烧控制和自动输送。<\/div><\/div>","<p><strong>核心发展方向：轻质化、节能化、温度均匀化、机械化与自动化。<\/strong>\n<strong><\/strong><\/p>"]},{"id":3,"q":"现代隧道窑如何减小预热带末端上下温差？","html":"<p><strong>五项措施：<\/strong><\/p><ol type=\"1\">\n<li><strong>降低窑道断面高度<\/strong>，减小气流分层和上下压头差。<\/li>\n<li><strong>采用轻质窑车<\/strong>，减少窑车蓄热及下部吸热。<\/li>\n<li><strong>加强窑车密封<\/strong>，防止车下冷空气进入窑内。<\/li>\n<li><strong>设置搅拌气幕<\/strong>，强化上下气流混合。<\/li>\n<li><strong>预热带末端设置调温烧嘴<\/strong>，适当提高窑内下部温度。<\/li>\n<\/ol><p><strong>记忆：降高度—轻窑车—强密封—搅拌气幕—末端补热。<\/strong>\n<strong><\/strong><\/p>","refs":[],"steps":["<p><strong>五项措施：<\/strong><\/p>","<div class=\"step-prose\"><div><strong>降低窑道断面高度<\/strong>，减小气流分层和上下压头差。<\/div><\/div>","<div class=\"step-prose\"><div><strong>采用轻质窑车<\/strong>，减少窑车蓄热及下部吸热。<\/div><\/div>","<div class=\"step-prose\"><div><strong>加强窑车密封<\/strong>，防止车下冷空气进入窑内。<\/div><\/div>","<div class=\"step-prose\"><div><strong>设置搅拌气幕<\/strong>，强化上下气流混合。<\/div><\/div>","<div class=\"step-prose\"><div><strong>预热带末端设置调温烧嘴<\/strong>，适当提高窑内下部温度。<\/div><\/div>","<p><strong>记忆：降高度—轻窑车—强密封—搅拌气幕—末端补热。<\/strong>\n<strong><\/strong><\/p>"]},{"id":4,"q":"隧道窑冷却系统分几段？各段如何设置？","html":"<table>\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>区段<\/th>\n<th>温度范围<\/th>\n<th>设置和作用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>急冷段<\/strong><\/td>\n<td><strong>700°C以上<\/strong><\/td>\n<td>采用空气喷入等方式强化换热。传统窑可从窑顶和两侧窑墙布风；现代窑可设置多组交错喷风口，使冷却均匀<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>缓冷段<\/strong><\/td>\n<td><strong>700～400°C<\/strong><\/td>\n<td><strong>不直接大量鼓入冷空气<\/strong>，而采用抽出窑内热空气、组织相邻区段气流等方式，平稳控制降温<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>快冷段<\/strong><\/td>\n<td><strong>400°C以下<\/strong><\/td>\n<td>靠近出口送入一定量冷空气，强化最终冷却，使制品达到合适出窑温度<\/td>\n<\/tr>\n<\/tbody>\n<\/table><p><strong>次序：急冷 → 缓冷 → 快冷。<\/strong>\n重点记忆三段名称、温度及<strong>“喷风—抽热风—进冷风”<\/strong>的组织方法。<strong><\/strong><\/p>","refs":[],"steps":["<table>\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>区段<\/th>\n<th>温度范围<\/th>\n<th>设置和作用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>急冷段<\/strong><\/td>\n<td><strong>700°C以上<\/strong><\/td>\n<td>采用空气喷入等方式强化换热。传统窑可从窑顶和两侧窑墙布风；现代窑可设置多组交错喷风口，使冷却均匀<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>缓冷段<\/strong><\/td>\n<td><strong>700～400°C<\/strong><\/td>\n<td><strong>不直接大量鼓入冷空气<\/strong>，而采用抽出窑内热空气、组织相邻区段气流等方式，平稳控制降温<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>快冷段<\/strong><\/td>\n<td><strong>400°C以下<\/strong><\/td>\n<td>靠近出口送入一定量冷空气，强化最终冷却，使制品达到合适出窑温度<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","<p><strong>次序：急冷 → 缓冷 → 快冷。<\/strong>\n重点记忆三段名称、温度及<strong>“喷风—抽热风—进冷风”<\/strong>的组织方法。<strong><\/strong><\/p>"]},{"id":5,"q":"为什么现代隧道窑常用平顶结构？","html":"<ol type=\"1\">\n<li><strong>平顶顶部中心无较大的额外拱形空间<\/strong>，有利于减小窑内无效空间。<\/li>\n<li><strong>有利于在侧墙上部设置高温烧嘴<\/strong>，便于改善加热及气流组织。<\/li>\n<li><strong>便于采用轻质耐火材料和轻质窑顶结构<\/strong>，降低窑体重量、蓄热与散热损失。<\/li>\n<\/ol><p><strong><\/strong><\/p>","refs":[],"steps":["<div class=\"step-prose\"><div><strong>平顶顶部中心无较大的额外拱形空间<\/strong>，有利于减小窑内无效空间。<\/div><\/div>","<div class=\"step-prose\"><div><strong>有利于在侧墙上部设置高温烧嘴<\/strong>，便于改善加热及气流组织。<\/div><\/div>","<div class=\"step-prose\"><div><strong>便于采用轻质耐火材料和轻质窑顶结构<\/strong>，降低窑体重量、蓄热与散热损失。<\/div><\/div>"]},{"id":6,"q":"隧道窑的主要结构与工作系统","html":"<p><strong>窑体：<\/strong>\n窑墙、窑顶、窑底；窑内分为预热带、烧成带、冷却带。<br/>\n<strong>窑车：<\/strong>\n车架、车轮与轨道、耐火车衬、装坯结构、砂封/曲封。<br/>\n<strong>三个系统：<\/strong>\n<strong>排烟系统、燃烧系统、冷却通风系统<\/strong>。<br/>\n<strong>辅助部分：<\/strong>\n窑门、烟道、风机、气幕、测温测压、控制装置和窑车推进设备。<\/p><ul>\n<li><strong>排烟系统<\/strong>：在预热带前部通过排烟口、烟道等抽排烟气；有<strong>集中排烟、分散排烟<\/strong>方式。<\/li>\n<li><strong>燃烧系统<\/strong>：由燃料及助燃空气供给、烧嘴、阀门和控制装置组成，满足烧成温度、气氛要求。<\/li>\n<li><strong>冷却通风系统<\/strong>：调节急冷、缓冷和快冷气流，兼顾热回收。<\/li>\n<li><strong>砂封/曲封<\/strong>：阻止车下冷空气窜入窑内及热气外泄，保护窑车金属部件。<\/li>\n<\/ul><p><strong><\/strong><\/p>","refs":[],"steps":["<p><strong>窑体：<\/strong>\n窑墙、窑顶、窑底；窑内分为预热带、烧成带、冷却带。<br/>\n<strong>窑车：<\/strong>\n车架、车轮与轨道、耐火车衬、装坯结构、砂封/曲封。<br/>\n<strong>三个系统：<\/strong>\n<strong>排烟系统、燃烧系统、冷却通风系统<\/strong>。<br/>\n<strong>辅助部分：<\/strong>\n窑门、烟道、风机、气幕、测温测压、控制装置和窑车推进设备。<\/p>","<div class=\"step-prose\"><div><strong>排烟系统<\/strong>：在预热带前部通过排烟口、烟道等抽排烟气；有<strong>集中排烟、分散排烟<\/strong>方式。<\/div><\/div>","<div class=\"step-prose\"><div><strong>燃烧系统<\/strong>：由燃料及助燃空气供给、烧嘴、阀门和控制装置组成，满足烧成温度、气氛要求。<\/div><\/div>","<div class=\"step-prose\"><div><strong>冷却通风系统<\/strong>：调节急冷、缓冷和快冷气流，兼顾热回收。<\/div><\/div>","<div class=\"step-prose\"><div><strong>砂封/曲封<\/strong>：阻止车下冷空气窜入窑内及热气外泄，保护窑车金属部件。<\/div><\/div>"]},{"id":7,"q":"隧道窑温度、压力、气氛制度的关系","html":"<ul>\n<li><strong>温度制度<\/strong>决定制品的升温、保温和冷却历程。<\/li>\n<li><strong>压力制度<\/strong>控制窑内气体流向、排烟和漏风，是温度、气氛稳定的重要条件。<\/li>\n<li><strong>气氛制度<\/strong>决定氧化、还原环境，影响化学反应和制品质量。<\/li>\n<li><strong>窑车速度<\/strong>决定制品通过各温区的停留时间。<\/li>\n<\/ul><p><strong>压力异常 → 漏风/串气变化 → 温度及气氛改变 →\n烧成质量波动。<\/strong> <strong><\/strong><\/p>","refs":[],"steps":["<div class=\"step-prose\"><div><strong>温度制度<\/strong>决定制品的升温、保温和冷却历程。<\/div><\/div>","<div class=\"step-prose\"><div><strong>压力制度<\/strong>控制窑内气体流向、排烟和漏风，是温度、气氛稳定的重要条件。<\/div><\/div>","<div class=\"step-prose\"><div><strong>气氛制度<\/strong>决定氧化、还原环境，影响化学反应和制品质量。<\/div><\/div>","<div class=\"step-prose\"><div><strong>窑车速度<\/strong>决定制品通过各温区的停留时间。<\/div><\/div>","<p><strong>压力异常 → 漏风/串气变化 → 温度及气氛改变 →\n烧成质量波动。<\/strong> <strong><\/strong><\/p>"]},{"id":8,"q":"隧道窑与辊道窑的优缺点","html":"<table>\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>项目<\/th>\n<th>隧道窑<\/th>\n<th>辊道窑<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>输送方式<\/td>\n<td><strong>窑车<\/strong><\/td>\n<td><strong>辊棒<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>共同点<\/td>\n<td>连续式烧成、分带控制、可以机械化生产<\/td>\n<td>连续式烧成、分带控制、可以机械化生产<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>优点<\/td>\n<td><strong>生产率高、产量大、热工制度稳定、易自动化<\/strong>，适合一定规模连续生产<\/td>\n<td><strong>快速、连续、输送平稳、易自动化<\/strong>，适合相应薄板及陶瓷制品<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>缺点<\/td>\n<td><strong>一次性投资较大<\/strong>；窑车蓄热、密封与装垛温差问题较突出<\/td>\n<td><strong>辊棒承载、耐温与耐腐蚀性能受限<\/strong>；对制品形状、质量和尺寸有要求<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>重要控制<\/td>\n<td>窑车运行、装垛、窑车密封、上下温差<\/td>\n<td>辊棒运行、传动同步、坯体承载、上下火力与温度均匀性<\/td>\n<\/tr>\n<\/tbody>\n<\/table><p><strong><\/strong><\/p>","refs":[],"steps":["<table>\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>项目<\/th>\n<th>隧道窑<\/th>\n<th>辊道窑<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>输送方式<\/td>\n<td><strong>窑车<\/strong><\/td>\n<td><strong>辊棒<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>共同点<\/td>\n<td>连续式烧成、分带控制、可以机械化生产<\/td>\n<td>连续式烧成、分带控制、可以机械化生产<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>优点<\/td>\n<td><strong>生产率高、产量大、热工制度稳定、易自动化<\/strong>，适合一定规模连续生产<\/td>\n<td><strong>快速、连续、输送平稳、易自动化<\/strong>，适合相应薄板及陶瓷制品<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>缺点<\/td>\n<td><strong>一次性投资较大<\/strong>；窑车蓄热、密封与装垛温差问题较突出<\/td>\n<td><strong>辊棒承载、耐温与耐腐蚀性能受限<\/strong>；对制品形状、质量和尺寸有要求<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>重要控制<\/td>\n<td>窑车运行、装垛、窑车密封、上下温差<\/td>\n<td>辊棒运行、传动同步、坯体承载、上下火力与温度均匀性<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"]},{"id":9,"q":"梭式窑的工作过程和优缺点","html":"<p><strong>工作过程：<\/strong> 装窑 → 推车入窑 → 升温 → 保温 → 降温 →\n出窑。<br/>\n<strong>窑顶形式：<\/strong> <strong>拱顶、平顶<\/strong>。<\/p><ul>\n<li><strong>优点<\/strong>：适合小批量、多品种、特殊烧成曲线；工艺调整灵活。<\/li>\n<li><strong>缺点<\/strong>：间歇生产需重复加热窑体和部分设备，生产周期较长，连续余热回收条件不如隧道窑。<\/li>\n<li><strong>与隧道窑区别<\/strong>：梭式窑<strong>同一窑室随时间升降温<\/strong>；隧道窑<strong>沿空间分布不同温区，坯体连续移动<\/strong>。<\/li>\n<\/ul><p><strong><\/strong><\/p>","refs":[],"steps":["<p><strong>工作过程：<\/strong> 装窑 → 推车入窑 → 升温 → 保温 → 降温 →\n出窑。<br/>\n<strong>窑顶形式：<\/strong> <strong>拱顶、平顶<\/strong>。<\/p>","<div class=\"step-prose\"><div><strong>优点<\/strong>：适合小批量、多品种、特殊烧成曲线；工艺调整灵活。<\/div><\/div>","<div class=\"step-prose\"><div><strong>缺点<\/strong>：间歇生产需重复加热窑体和部分设备，生产周期较长，连续余热回收条件不如隧道窑。<\/div><\/div>","<div class=\"step-prose\"><div><strong>与隧道窑区别<\/strong>：梭式窑<strong>同一窑室随时间升降温<\/strong>；隧道窑<strong>沿空间分布不同温区，坯体连续移动<\/strong>。<\/div><\/div>"]},{"id":10,"q":"电阻炉的结构、优缺点及电热元件选择","html":"<p><strong>基本结构：<\/strong>\n炉体、炉衬和保温层、炉门、<strong>电热元件<\/strong>、供电及调压系统、测温控温装置、工件支承装置。<\/p><p><strong>优点：<\/strong>\n调温方便、热工制度容易控制，炉内无需直接燃烧；可用于多种规定气氛和实验条件。<br/>\n<strong>限制：<\/strong>\n依赖供电和电热元件寿命，高温气氛、安装形式、表面负荷以及电费成本均需考虑。<\/p><p><strong>选择电热元件的因素：<\/strong><\/p><ol type=\"1\">\n<li><strong>允许使用温度<\/strong>、长期耐热性能。<\/li>\n<li><strong>电阻率及其温度特性<\/strong>。<\/li>\n<li><strong>抗氧化、抗腐蚀及气氛适应性<\/strong>。<\/li>\n<li><strong>热稳定性和机械强度<\/strong>。<\/li>\n<li><strong>安装、接线、维护与经济性<\/strong>。<\/li>\n<\/ol><p><strong><\/strong><\/p>","refs":[],"steps":["<p><strong>基本结构：<\/strong>\n炉体、炉衬和保温层、炉门、<strong>电热元件<\/strong>、供电及调压系统、测温控温装置、工件支承装置。<\/p>","<p><strong>优点：<\/strong>\n调温方便、热工制度容易控制，炉内无需直接燃烧；可用于多种规定气氛和实验条件。<br/>\n<strong>限制：<\/strong>\n依赖供电和电热元件寿命，高温气氛、安装形式、表面负荷以及电费成本均需考虑。<\/p>","<p><strong>选择电热元件的因素：<\/strong><\/p>","<div class=\"step-prose\"><div><strong>允许使用温度<\/strong>、长期耐热性能。<\/div><\/div>","<div class=\"step-prose\"><div><strong>电阻率及其温度特性<\/strong>。<\/div><\/div>","<div class=\"step-prose\"><div><strong>抗氧化、抗腐蚀及气氛适应性<\/strong>。<\/div><\/div>","<div class=\"step-prose\"><div><strong>热稳定性和机械强度<\/strong>。<\/div><\/div>","<div class=\"step-prose\"><div><strong>安装、接线、维护与经济性<\/strong>。<\/div><\/div>"]},{"id":11,"q":"硅碳棒电阻率变化及老化","html":"<p><strong>电阻率—温度曲线：<\/strong><\/p><ul>\n<li>较低温度区：<strong>温度升高，电阻率下降<\/strong>。<\/li>\n<li>约 <strong>800～900°C<\/strong> 附近：电阻率达到较小值。<\/li>\n<li>较高温度区：<strong>温度继续升高，电阻率回升<\/strong>。<\/li>\n<\/ul><p><strong><\/strong>“<strong>氧化性气氛中正常使用温度可达1450°C，连续使用可达2000小时<\/strong>。”<strong><\/strong><\/p><p><strong>老化原因：<\/strong>\n硅碳棒高温工作时与空气中的氧发生氧化反应，生成含<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S<\/mi><mi mathvariant=\"normal\">i<\/mi><msub><mi mathvariant=\"normal\">O<\/mi><mn mathvariant=\"normal\">2<\/mn><\/msub><\/mrow><annotation encoding=\"application/x-tex\">\\mathrm{SiO_2}<\/annotation><\/semantics><\/math>的氧化层，长期使用使电阻逐步增加。可用总体反应示意：<\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S<\/mi><mi mathvariant=\"normal\">i<\/mi><mi mathvariant=\"normal\">C<\/mi><mo mathvariant=\"normal\">+<\/mo><mn mathvariant=\"normal\">2<\/mn><msub><mi mathvariant=\"normal\">O<\/mi><mn mathvariant=\"normal\">2<\/mn><\/msub><mo mathvariant=\"normal\">→<\/mo><mi mathvariant=\"normal\">S<\/mi><mi mathvariant=\"normal\">i<\/mi><msub><mi mathvariant=\"normal\">O<\/mi><mn mathvariant=\"normal\">2<\/mn><\/msub><mo mathvariant=\"normal\">+<\/mo><mi mathvariant=\"normal\">C<\/mi><msub><mi mathvariant=\"normal\">O<\/mi><mn mathvariant=\"normal\">2<\/mn><\/msub><\/mrow><annotation encoding=\"application/x-tex\">\n\\mathrm{SiC+2O_2\\longrightarrow SiO_2+CO_2}\n<\/annotation><\/semantics><\/math><\/p><p><strong>老化后的后果（电压不变）：<\/strong><\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R<\/mi><mo>↑<\/mo><mspace width=\"1.0em\"><\/mspace><mo>⇒<\/mo><mspace width=\"1.0em\"><\/mspace><mi>I<\/mi><mo>=<\/mo><mfrac><mi>U<\/mi><mi>R<\/mi><\/mfrac><mo>↓<\/mo><mspace width=\"1.0em\"><\/mspace><mo>⇒<\/mo><mspace width=\"1.0em\"><\/mspace><mi>P<\/mi><mo>=<\/mo><mfrac><msup><mi>U<\/mi><mn>2<\/mn><\/msup><mi>R<\/mi><\/mfrac><mo>↓<\/mo><\/mrow><annotation encoding=\"application/x-tex\">\nR\\uparrow\\quad\\Rightarrow\\quad I=\\frac UR\\downarrow\\quad\\Rightarrow\\quad P=\\frac{U^2}{R}\\downarrow\n<\/annotation><\/semantics><\/math><\/p><p><strong>补偿方法：<\/strong><\/p><ol type=\"1\">\n<li><strong>在额定范围内提高供电电压<\/strong>，恢复所需功率。<\/li>\n<li><strong>在电气条件允许时调整硅碳棒串并联组合<\/strong>，减小等效电阻。<\/li>\n<li>元件老化严重时<strong>更换元件<\/strong>，避免过载、局部过热。<\/li>\n<\/ol><p><strong>辨析：<\/strong> 电阻率\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ρ<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>T<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">\\rho(T)<\/annotation><\/semantics><\/math>\n随温度先减后增，不等于“电阻温度系数\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>T<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">\\alpha(T)<\/annotation><\/semantics><\/math>\n本身先减后增”。<strong><\/strong><\/p>","refs":[],"steps":["<p><strong>电阻率—温度曲线：<\/strong><\/p>","<div class=\"step-prose\"><div>较低温度区：<strong>温度升高，电阻率下降<\/strong>。<\/div><\/div>","<div class=\"step-prose\"><div>约 <strong>800～900°C<\/strong> 附近：电阻率达到较小值。<\/div><\/div>","<div class=\"step-prose\"><div>较高温度区：<strong>温度继续升高，电阻率回升<\/strong>。<\/div><\/div>","<div class=\"sequence\">低温升温&lt;br/&gt;电阻率下降 → 约800～900°C&lt;br/&gt;电阻率最低 → 继续升温&lt;br/&gt;电阻率回升<\/div>","<p><strong><\/strong>“<strong>氧化性气氛中正常使用温度可达1450°C，连续使用可达2000小时<\/strong>。”<strong><\/strong><\/p>","<p><strong>老化原因：<\/strong>\n硅碳棒高温工作时与空气中的氧发生氧化反应，生成含<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S<\/mi><mi mathvariant=\"normal\">i<\/mi><msub><mi mathvariant=\"normal\">O<\/mi><mn mathvariant=\"normal\">2<\/mn><\/msub><\/mrow><annotation encoding=\"application/x-tex\">\\mathrm{SiO_2}<\/annotation><\/semantics><\/math>的氧化层，长期使用使电阻逐步增加。可用总体反应示意：<\/p>","<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S<\/mi><mi mathvariant=\"normal\">i<\/mi><mi mathvariant=\"normal\">C<\/mi><mo mathvariant=\"normal\">+<\/mo><mn mathvariant=\"normal\">2<\/mn><msub><mi mathvariant=\"normal\">O<\/mi><mn mathvariant=\"normal\">2<\/mn><\/msub><mo mathvariant=\"normal\">→<\/mo><mi mathvariant=\"normal\">S<\/mi><mi mathvariant=\"normal\">i<\/mi><msub><mi mathvariant=\"normal\">O<\/mi><mn mathvariant=\"normal\">2<\/mn><\/msub><mo mathvariant=\"normal\">+<\/mo><mi mathvariant=\"normal\">C<\/mi><msub><mi mathvariant=\"normal\">O<\/mi><mn mathvariant=\"normal\">2<\/mn><\/msub><\/mrow><annotation encoding=\"application/x-tex\">\n\\mathrm{SiC+2O_2\\longrightarrow SiO_2+CO_2}\n<\/annotation><\/semantics><\/math><\/p>","<p><strong>老化后的后果（电压不变）：<\/strong><\/p>","<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R<\/mi><mo>↑<\/mo><mspace width=\"1.0em\"><\/mspace><mo>⇒<\/mo><mspace width=\"1.0em\"><\/mspace><mi>I<\/mi><mo>=<\/mo><mfrac><mi>U<\/mi><mi>R<\/mi><\/mfrac><mo>↓<\/mo><mspace width=\"1.0em\"><\/mspace><mo>⇒<\/mo><mspace width=\"1.0em\"><\/mspace><mi>P<\/mi><mo>=<\/mo><mfrac><msup><mi>U<\/mi><mn>2<\/mn><\/msup><mi>R<\/mi><\/mfrac><mo>↓<\/mo><\/mrow><annotation encoding=\"application/x-tex\">\nR\\uparrow\\quad\\Rightarrow\\quad I=\\frac UR\\downarrow\\quad\\Rightarrow\\quad P=\\frac{U^2}{R}\\downarrow\n<\/annotation><\/semantics><\/math><\/p>","<p><strong>补偿方法：<\/strong><\/p>","<div class=\"step-prose\"><div><strong>在额定范围内提高供电电压<\/strong>，恢复所需功率。<\/div><\/div>","<div class=\"step-prose\"><div><strong>在电气条件允许时调整硅碳棒串并联组合<\/strong>，减小等效电阻。<\/div><\/div>","<div class=\"step-prose\"><div>元件老化严重时<strong>更换元件<\/strong>，避免过载、局部过热。<\/div><\/div>","<p><strong>辨析：<\/strong> 电阻率\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ρ<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>T<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">\\rho(T)<\/annotation><\/semantics><\/math>\n随温度先减后增，不等于“电阻温度系数\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α<\/mi><mrow><mo form=\"prefix\" stretchy=\"true\">(<\/mo><mi>T<\/mi><mo form=\"postfix\" stretchy=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">\\alpha(T)<\/annotation><\/semantics><\/math>\n本身先减后增”。<strong><\/strong><\/p>"]}],"glass":[{"id":1,"q":"玻璃熔制的五个阶段","html":"<ol type=\"1\">\n<li><strong>硅酸盐形成<\/strong>：配合料受热，部分原料分解和相互反应，生成硅酸盐等中间产物。<\/li>\n<li><strong>玻璃液形成<\/strong>：各组分逐渐熔融并形成连续玻璃液，仍可能有不均匀和气泡。<\/li>\n<li><strong>澄清<\/strong>：排除玻璃液内的气泡，改善澄清质量。<\/li>\n<li><strong>均化<\/strong>：通过扩散及对流减小玻璃液中成分和温度的不均匀。<\/li>\n<li><strong>冷却（温度调整）<\/strong>：使玻璃液达到适于成型的温度和黏度。<\/li>\n<\/ol><p><strong>五阶段顺序：硅酸盐形成—玻璃液形成—澄清—均化—冷却。<\/strong>\n<strong><\/strong><\/p>","refs":[],"steps":["<div class=\"step-prose\"><div><strong>硅酸盐形成<\/strong>：配合料受热，部分原料分解和相互反应，生成硅酸盐等中间产物。<\/div><\/div>","<div class=\"step-prose\"><div><strong>玻璃液形成<\/strong>：各组分逐渐熔融并形成连续玻璃液，仍可能有不均匀和气泡。<\/div><\/div>","<div class=\"step-prose\"><div><strong>澄清<\/strong>：排除玻璃液内的气泡，改善澄清质量。<\/div><\/div>","<div class=\"step-prose\"><div><strong>均化<\/strong>：通过扩散及对流减小玻璃液中成分和温度的不均匀。<\/div><\/div>","<div class=\"step-prose\"><div><strong>冷却（温度调整）<\/strong>：使玻璃液达到适于成型的温度和黏度。<\/div><\/div>","<p><strong>五阶段顺序：硅酸盐形成—玻璃液形成—澄清—均化—冷却。<\/strong>\n<strong><\/strong><\/p>"]},{"id":2,"q":"玻璃熔窑的构造与四大部分","html":"<p><strong>组成：<\/strong>\n熔制部分、热源供给部分、余热回收部分、排烟及辅助设施。熔制部分包含<strong>投料部、熔化部、冷却/工作部<\/strong>及有关流道、分隔构件。<\/p><p><strong>熔窑常见结构标号：<\/strong>\n投料池、前脸墙（上挡墙）、熔化池、池壁、池底、胸墙、碹顶、火焰空间、小炉、蓄热室、流液洞、分隔装置、耳池、工作池、烟道、承重梁、立柱。<\/p><p><strong><\/strong><\/p>","refs":[],"steps":["<p><strong>组成：<\/strong>\n熔制部分、热源供给部分、余热回收部分、排烟及辅助设施。熔制部分包含<strong>投料部、熔化部、冷却/工作部<\/strong>及有关流道、分隔构件。<\/p>","<p><strong>熔窑常见结构标号：<\/strong>\n投料池、前脸墙（上挡墙）、熔化池、池壁、池底、胸墙、碹顶、火焰空间、小炉、蓄热室、流液洞、分隔装置、耳池、工作池、烟道、承重梁、立柱。<\/p>"]},{"id":3,"q":"投料部的组成及作用","html":"<p><strong>（1）投料池<\/strong>：位于熔化池外侧、与熔化池相通的较小池体。<strong>作用：集中配合料、使配合料摊平，并适当预热。<\/strong><\/p><p><strong>（2）前脸墙（上挡墙）<\/strong>：位于投料部和主窑连接处上方。<strong>作用：阻挡高温辐射和部分热气外逸，降低投料设备受热程度。<\/strong><\/p><p><strong><\/strong><\/p>","refs":[],"steps":["<p><strong>（1）投料池<\/strong>：位于熔化池外侧、与熔化池相通的较小池体。<strong>作用：集中配合料、使配合料摊平，并适当预热。<\/strong><\/p>","<p><strong>（2）前脸墙（上挡墙）<\/strong>：位于投料部和主窑连接处上方。<strong>作用：阻挡高温辐射和部分热气外逸，降低投料设备受热程度。<\/strong><\/p>"]},{"id":4,"q":"玻璃液分隔装置的作用","html":"<ol type=\"1\">\n<li><strong>阻挡未充分熔化的料、浮渣和杂质<\/strong>进入冷却部。<\/li>\n<li><strong>使熔制完成的玻璃液在流向工作部时得到适当冷却<\/strong>。<\/li>\n<li><strong>调节玻璃液流量和流动通道<\/strong>。<\/li>\n<li><strong>减少冷却部玻璃液向熔化部回流<\/strong>，改善不同区段的运行条件。<\/li>\n<\/ol><p>可按作用深度区分<strong>浅层分隔装置、深层分隔装置<\/strong>，识图时要辨认挡墙、水管、流液通道等。<strong><\/strong><\/p>","refs":[],"steps":["<div class=\"step-prose\"><div><strong>阻挡未充分熔化的料、浮渣和杂质<\/strong>进入冷却部。<\/div><\/div>","<div class=\"step-prose\"><div><strong>使熔制完成的玻璃液在流向工作部时得到适当冷却<\/strong>。<\/div><\/div>","<div class=\"step-prose\"><div><strong>调节玻璃液流量和流动通道<\/strong>。<\/div><\/div>","<div class=\"step-prose\"><div><strong>减少冷却部玻璃液向熔化部回流<\/strong>，改善不同区段的运行条件。<\/div><\/div>","<p>可按作用深度区分<strong>浅层分隔装置、深层分隔装置<\/strong>，识图时要辨认挡墙、水管、流液通道等。<strong><\/strong><\/p>"]},{"id":5,"q":"耳池是什么？有什么作用？","html":"<p><strong>结构：<\/strong>\n熔化池末端两侧向外突出的矩形或近似方形小池体，与主体熔池相通。<\/p><p><strong>作用：<\/strong>\n<strong>加强玻璃液横向对流、促进均化和澄清、使部分玻璃液提前回流、减少不合格玻璃液向冷却部流动。<\/strong>\n<strong><\/strong><\/p>","refs":[],"steps":["<p><strong>结构：<\/strong>\n熔化池末端两侧向外突出的矩形或近似方形小池体，与主体熔池相通。<\/p>","<p><strong>作用：<\/strong>\n<strong>加强玻璃液横向对流、促进均化和澄清、使部分玻璃液提前回流、减少不合格玻璃液向冷却部流动。<\/strong>\n<strong><\/strong><\/p>"]},{"id":6,"q":"玻璃池窑的窑体支承和火焰空间构件","html":"<p><strong>窑体支承：<\/strong>\n池窑重量由窑底立柱、钢板、工字钢、主梁和次梁等结构承担；支承与拉结构件应兼顾耐火材料热膨胀所产生的位移和应力。<\/p><p><strong>火焰空间：<\/strong>\n碹顶、胸墙、前后端墙及吊墙等围成高温燃烧、辐射换热空间。吊墙形式包括<strong>矮碹吊墙、U形吊墙及双拱形吊墙<\/strong>等，识图时应结合的具体名称与位置。<\/p><p><strong>常见燃料：重油、天然气、煤气。<\/strong>\n不同燃料的小炉结构和供热布置可能不同，识图要辨认燃料喷入部位、助燃空气通道和火焰进入方向。<strong><\/strong><\/p>","refs":[],"steps":["<p><strong>窑体支承：<\/strong>\n池窑重量由窑底立柱、钢板、工字钢、主梁和次梁等结构承担；支承与拉结构件应兼顾耐火材料热膨胀所产生的位移和应力。<\/p>","<p><strong>火焰空间：<\/strong>\n碹顶、胸墙、前后端墙及吊墙等围成高温燃烧、辐射换热空间。吊墙形式包括<strong>矮碹吊墙、U形吊墙及双拱形吊墙<\/strong>等，识图时应结合的具体名称与位置。<\/p>","<p><strong>常见燃料：重油、天然气、煤气。<\/strong>\n不同燃料的小炉结构和供热布置可能不同，识图要辨认燃料喷入部位、助燃空气通道和火焰进入方向。<strong><\/strong><\/p>"]},{"id":7,"q":"玻璃熔窑工艺控制的主要制度","html":"<p><strong>重点控制变量：<\/strong>\n<strong>温度、玻璃液面、泡界线、窑压、气氛<\/strong>。<\/p><ul>\n<li><strong>温度<\/strong>：影响原料熔化、澄清、均化、玻璃液黏度和流动。<\/li>\n<li><strong>液面<\/strong>：影响玻璃液流量、池壁受热和成型稳定性。<\/li>\n<li><strong>泡界线<\/strong>：反映料堆、熔化与澄清状态。<\/li>\n<li><strong>窑压<\/strong>：影响漏风、火焰气流及温度场。<\/li>\n<li><strong>气氛<\/strong>：影响燃烧和玻璃液化学状态。<\/li>\n<\/ul><p><strong>温度曲线形式：<\/strong>\n山形、桥形、双高峰形。识图时应注意<strong>峰值数量、热点位置及温区关系<\/strong>。<strong><\/strong><\/p>","refs":[],"steps":["<p><strong>重点控制变量：<\/strong>\n<strong>温度、玻璃液面、泡界线、窑压、气氛<\/strong>。<\/p>","<div class=\"step-prose\"><div><strong>温度<\/strong>：影响原料熔化、澄清、均化、玻璃液黏度和流动。<\/div><\/div>","<div class=\"step-prose\"><div><strong>液面<\/strong>：影响玻璃液流量、池壁受热和成型稳定性。<\/div><\/div>","<div class=\"step-prose\"><div><strong>泡界线<\/strong>：反映料堆、熔化与澄清状态。<\/div><\/div>","<div class=\"step-prose\"><div><strong>窑压<\/strong>：影响漏风、火焰气流及温度场。<\/div><\/div>","<div class=\"step-prose\"><div><strong>气氛<\/strong>：影响燃烧和玻璃液化学状态。<\/div><\/div>","<p><strong>温度曲线形式：<\/strong>\n山形、桥形、双高峰形。识图时应注意<strong>峰值数量、热点位置及温区关系<\/strong>。<strong><\/strong><\/p>"]},{"id":8,"q":"四大稳和四小稳","html":"<table>\n<thead>\n<tr class=\"header\">\n<th>四大稳<\/th>\n<th>四小稳<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>原料稳<\/strong><\/td>\n<td><strong>熔化温度稳<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>燃料稳<\/strong><\/td>\n<td><strong>窑压稳<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>熔化稳<\/strong><\/td>\n<td><strong>液面稳<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>成形稳<\/strong><\/td>\n<td><strong>泡界线稳<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><p><strong><\/strong><\/p>","refs":[],"steps":["<table>\n<thead>\n<tr class=\"header\">\n<th>四大稳<\/th>\n<th>四小稳<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>原料稳<\/strong><\/td>\n<td><strong>熔化温度稳<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>燃料稳<\/strong><\/td>\n<td><strong>窑压稳<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>熔化稳<\/strong><\/td>\n<td><strong>液面稳<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>成形稳<\/strong><\/td>\n<td><strong>泡界线稳<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"]},{"id":9,"q":"什么是泡界线？如何形成？","html":"<p><strong>定义：<\/strong>\n玻璃熔化池中<strong>泡沫稠密区与清亮平静玻璃液区之间的一条明显分界线<\/strong>。<\/p><p><strong>形成与位置影响因素：<\/strong><\/p><ol type=\"1\">\n<li><strong>料堆向前移动的作用<\/strong>。<\/li>\n<li><strong>热点附近玻璃液对流与回流<\/strong>。<\/li>\n<li><strong>高温熔化、气体析出、泡沫生成和澄清过程<\/strong>。<\/li>\n<\/ol><p>位置受<strong>配合料投入、热点温度、玻璃液流动及拉引量<\/strong>共同影响；控制时应综合调整热负荷、供料和运行制度，而不单凭一个现象机械增减温度。<strong><\/strong><\/p>","refs":[],"steps":["<p><strong>定义：<\/strong>\n玻璃熔化池中<strong>泡沫稠密区与清亮平静玻璃液区之间的一条明显分界线<\/strong>。<\/p>","<p><strong>形成与位置影响因素：<\/strong><\/p>","<div class=\"step-prose\"><div><strong>料堆向前移动的作用<\/strong>。<\/div><\/div>","<div class=\"step-prose\"><div><strong>热点附近玻璃液对流与回流<\/strong>。<\/div><\/div>","<div class=\"step-prose\"><div><strong>高温熔化、气体析出、泡沫生成和澄清过程<\/strong>。<\/div><\/div>","<p>位置受<strong>配合料投入、热点温度、玻璃液流动及拉引量<\/strong>共同影响；控制时应综合调整热负荷、供料和运行制度，而不单凭一个现象机械增减温度。<strong><\/strong><\/p>"]},{"id":10,"q":"为什么浮法玻璃采用锡槽？","html":"<ol type=\"1\">\n<li><strong>熔融锡的密度大于玻璃液<\/strong>，可以承托玻璃液。<\/li>\n<li>玻璃液在锡液表面能够连续铺展、流平，形成平整玻璃带。<\/li>\n<li>可以配合拉引速度、温度、挡边及其他成型设备调节玻璃带的<strong>厚度与宽度<\/strong>。<\/li>\n<li>适于连续平板玻璃生产，并获得较高表面质量。<\/li>\n<\/ol><p><strong>浮法成型控制力：重力、浮力、表面张力、界面张力与拉引作用。<\/strong>\n<strong><\/strong><\/p>","refs":[],"steps":["<div class=\"step-prose\"><div><strong>熔融锡的密度大于玻璃液<\/strong>，可以承托玻璃液。<\/div><\/div>","<div class=\"step-prose\"><div>玻璃液在锡液表面能够连续铺展、流平，形成平整玻璃带。<\/div><\/div>","<div class=\"step-prose\"><div>可以配合拉引速度、温度、挡边及其他成型设备调节玻璃带的<strong>厚度与宽度<\/strong>。<\/div><\/div>","<div class=\"step-prose\"><div>适于连续平板玻璃生产，并获得较高表面质量。<\/div><\/div>","<p><strong>浮法成型控制力：重力、浮力、表面张力、界面张力与拉引作用。<\/strong>\n<strong><\/strong><\/p>"]},{"id":11,"q":"浮法玻璃自由厚度与浸入比例","html":"<ul>\n<li>玻璃带沉入锡液深度约为总厚度的 <strong>1/3<\/strong>。<\/li>\n<li>露出锡液面高度约为总厚度的 <strong>2/3<\/strong>。<\/li>\n<li><strong>不施加拉引力<\/strong>时，自由厚度约为 <strong>7\nmm<\/strong>。<\/li>\n<li>某拉引工况参考厚度约 <strong>6\nmm<\/strong>；产品实际厚度随生产规格改变。<\/li>\n<li>玻璃在锡液表面的流平、抛光过程与温度和停留时间有关；<strong>表面抛光时间约1\nmin<\/strong>的参考值。<\/li>\n<\/ul><p><strong><\/strong><\/p>","refs":[],"steps":["<div class=\"step-prose\"><div>玻璃带沉入锡液深度约为总厚度的 <strong>1/3<\/strong>。<\/div><\/div>","<div class=\"step-prose\"><div>露出锡液面高度约为总厚度的 <strong>2/3<\/strong>。<\/div><\/div>","<div class=\"step-prose\"><div><strong>不施加拉引力<\/strong>时，自由厚度约为 <strong>7\nmm<\/strong>。<\/div><\/div>","<div class=\"step-prose\"><div>某拉引工况参考厚度约 <strong>6\nmm<\/strong>；产品实际厚度随生产规格改变。<\/div><\/div>","<div class=\"step-prose\"><div>玻璃在锡液表面的流平、抛光过程与温度和停留时间有关；<strong>表面抛光时间约1\nmin<\/strong>的参考值。<\/div><\/div>"]},{"id":12,"q":"锡槽的结构与分类","html":"<p><strong>按槽体外形：<\/strong>\n<strong>等宽型、前宽后窄型<\/strong>。<br/>\n<strong>按胸墙结构：<\/strong>\n<strong>固定胸墙型、活动胸墙型<\/strong>。<\/p><p><strong>入口：<\/strong>\n流道、流槽、调节闸板、安全闸板、备用闸板。<\/p><ul>\n<li><strong>调节闸板<\/strong>：调节闸板浸入玻璃液的深度，控制玻璃液流量。<\/li>\n<li><strong>安全闸板<\/strong>：紧急状态下截流或控制流道。<\/li>\n<li><strong>备用闸板<\/strong>：检修、切换或异常工况时备用。<\/li>\n<\/ul><p><strong>出口：<\/strong>\n过渡辊台将玻璃带从锡液表面抬起，送入退火窑，并配有必要的密封和保护设施。<\/p><p><strong>入槽玻璃液参考温度：约1100°C。<\/strong>\n<strong><\/strong><\/p>","refs":[],"steps":["<p><strong>按槽体外形：<\/strong>\n<strong>等宽型、前宽后窄型<\/strong>。<br/>\n<strong>按胸墙结构：<\/strong>\n<strong>固定胸墙型、活动胸墙型<\/strong>。<\/p>","<p><strong>入口：<\/strong>\n流道、流槽、调节闸板、安全闸板、备用闸板。<\/p>","<div class=\"step-prose\"><div><strong>调节闸板<\/strong>：调节闸板浸入玻璃液的深度，控制玻璃液流量。<\/div><\/div>","<div class=\"step-prose\"><div><strong>安全闸板<\/strong>：紧急状态下截流或控制流道。<\/div><\/div>","<div class=\"step-prose\"><div><strong>备用闸板<\/strong>：检修、切换或异常工况时备用。<\/div><\/div>","<p><strong>出口：<\/strong>\n过渡辊台将玻璃带从锡液表面抬起，送入退火窑，并配有必要的密封和保护设施。<\/p>","<p><strong>入槽玻璃液参考温度：约1100°C。<\/strong>\n<strong><\/strong><\/p>"]},{"id":13,"q":"为什么锡槽需要保护气氛？","html":"<p><strong>保护气体：氮气\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>N<\/mi><mn>2<\/mn><\/msub><annotation encoding=\"application/x-tex\">N_2<\/annotation><\/semantics><\/math>\n与氢气\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>H<\/mi><mn>2<\/mn><\/msub><annotation encoding=\"application/x-tex\">H_2<\/annotation><\/semantics><\/math>。<\/strong><\/p><ol type=\"1\">\n<li>防止高温锡液及有关部件氧化。<\/li>\n<li>减少锡氧化物造成的玻璃表面缺陷。<\/li>\n<li>有助于稳定锡槽内气氛及成型质量。<\/li>\n<\/ol><p><strong><\/strong><\/p>","refs":[],"steps":["<p><strong>保护气体：氮气\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>N<\/mi><mn>2<\/mn><\/msub><annotation encoding=\"application/x-tex\">N_2<\/annotation><\/semantics><\/math>\n与氢气\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>H<\/mi><mn>2<\/mn><\/msub><annotation encoding=\"application/x-tex\">H_2<\/annotation><\/semantics><\/math>。<\/strong><\/p>","<div class=\"step-prose\"><div>防止高温锡液及有关部件氧化。<\/div><\/div>","<div class=\"step-prose\"><div>减少锡氧化物造成的玻璃表面缺陷。<\/div><\/div>","<div class=\"step-prose\"><div>有助于稳定锡槽内气氛及成型质量。<\/div><\/div>"]},{"id":14,"q":"为什么锡槽多采用前宽后窄的形式？","html":"<ol type=\"1\">\n<li><strong>前部较宽<\/strong>：容纳玻璃液铺展、流平和成型，便于调整玻璃带宽度。<\/li>\n<li><strong>后部较窄<\/strong>：玻璃带逐渐成型、冷却，所需空间减小。<\/li>\n<li><strong>节约锡液用量<\/strong>，减少多余锡液表面积。<\/li>\n<li><strong>降低热损失和保护气氛控制负荷<\/strong>，有利于运行经济性及工艺稳定。<\/li>\n<\/ol><p><strong><\/strong><\/p>","refs":[],"steps":["<div class=\"step-prose\"><div><strong>前部较宽<\/strong>：容纳玻璃液铺展、流平和成型，便于调整玻璃带宽度。<\/div><\/div>","<div class=\"step-prose\"><div><strong>后部较窄<\/strong>：玻璃带逐渐成型、冷却，所需空间减小。<\/div><\/div>","<div class=\"step-prose\"><div><strong>节约锡液用量<\/strong>，减少多余锡液表面积。<\/div><\/div>","<div class=\"step-prose\"><div><strong>降低热损失和保护气氛控制负荷<\/strong>，有利于运行经济性及工艺稳定。<\/div><\/div>"]},{"id":15,"q":"为什么平板玻璃必须退火？","html":"<ol type=\"1\">\n<li>玻璃成型后温度较高，冷却时存在温度梯度，形成<strong>热应力<\/strong>。<\/li>\n<li>若通过退火温区时降温过快，玻璃结构调整及应力松弛不充分，会留下<strong>永久残余应力<\/strong>。<\/li>\n<li>残余应力可能降低<strong>机械强度、热稳定性和光学均匀性<\/strong>，造成切割、钢化或使用时破裂。<\/li>\n<li>通过<strong>均热—控制退火—分段冷却<\/strong>，使残余应力降低到允许范围。<\/li>\n<\/ol><p><strong><\/strong><\/p>","refs":[],"steps":["<div class=\"step-prose\"><div>玻璃成型后温度较高，冷却时存在温度梯度，形成<strong>热应力<\/strong>。<\/div><\/div>","<div class=\"step-prose\"><div>若通过退火温区时降温过快，玻璃结构调整及应力松弛不充分，会留下<strong>永久残余应力<\/strong>。<\/div><\/div>","<div class=\"step-prose\"><div>残余应力可能降低<strong>机械强度、热稳定性和光学均匀性<\/strong>，造成切割、钢化或使用时破裂。<\/div><\/div>","<div class=\"step-prose\"><div>通过<strong>均热—控制退火—分段冷却<\/strong>，使残余应力降低到允许范围。<\/div><\/div>"]},{"id":16,"q":"退火上下限温度的定义与数值","html":"<table>\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>项目<\/th>\n<th>退火上限温度<\/th>\n<th>退火下限温度<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>名称<\/td>\n<td><strong>退火点/最高退火温度<\/strong><\/td>\n<td><strong>应变点/最低退火温度<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>符号<\/td>\n<td><code>Tg<\/code><\/td>\n<td><code>Ts<\/code><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>应力松弛<\/td>\n<td><strong>15 min消除全部应力，或3 min消除95%<\/strong><\/td>\n<td><strong>16 h消除全部应力，或3 min仅消除5%<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>黏度（按给定量级）<\/td>\n<td><strong>约10^12.4 Pa·s<\/strong><\/td>\n<td><strong>约10^16.5 Pa·s<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>主要特征<\/td>\n<td>质点移动与结构调整较快<\/td>\n<td>结构调整缓慢，难以在短时间内消除应力<\/td>\n<\/tr>\n<\/tbody>\n<\/table><p><strong><\/strong><\/p>","refs":[],"steps":["<table>\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>项目<\/th>\n<th>退火上限温度<\/th>\n<th>退火下限温度<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>名称<\/td>\n<td><strong>退火点/最高退火温度<\/strong><\/td>\n<td><strong>应变点/最低退火温度<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>符号<\/td>\n<td><code>Tg<\/code><\/td>\n<td><code>Ts<\/code><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>应力松弛<\/td>\n<td><strong>15 min消除全部应力，或3 min消除95%<\/strong><\/td>\n<td><strong>16 h消除全部应力，或3 min仅消除5%<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>黏度（按给定量级）<\/td>\n<td><strong>约10^12.4 Pa·s<\/strong><\/td>\n<td><strong>约10^16.5 Pa·s<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>主要特征<\/td>\n<td>质点移动与结构调整较快<\/td>\n<td>结构调整缓慢，难以在短时间内消除应力<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"]},{"id":17,"q":"玻璃应力的分类和危害","html":"<table>\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>应力<\/th>\n<th>产生或分布特征<\/th>\n<th>危害/要点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>端面应力<\/strong><\/td>\n<td>玻璃带表面与板芯冷却温差造成的应力<\/td>\n<td>影响切割、深加工、钢化过程<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>平面应力<\/strong><\/td>\n<td>玻璃带横向温度不均造成的应力<\/td>\n<td>影响玻璃带平整、运行和成品质量<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>暂时应力<\/strong><\/td>\n<td>弹性范围内因温差存在的热应力<\/td>\n<td>温差消除后通常消失，但过大仍会破裂<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>永久应力<\/strong><\/td>\n<td>退火温区内冷却不均导致结构差异，降温后残留<\/td>\n<td>影响强度和热稳定性，须通过退火控制<\/td>\n<\/tr>\n<\/tbody>\n<\/table><p><strong><\/strong><\/p>","refs":[],"steps":["<table>\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<col style=\"width: 33%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>应力<\/th>\n<th>产生或分布特征<\/th>\n<th>危害/要点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>端面应力<\/strong><\/td>\n<td>玻璃带表面与板芯冷却温差造成的应力<\/td>\n<td>影响切割、深加工、钢化过程<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>平面应力<\/strong><\/td>\n<td>玻璃带横向温度不均造成的应力<\/td>\n<td>影响玻璃带平整、运行和成品质量<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>暂时应力<\/strong><\/td>\n<td>弹性范围内因温差存在的热应力<\/td>\n<td>温差消除后通常消失，但过大仍会破裂<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>永久应力<\/strong><\/td>\n<td>退火温区内冷却不均导致结构差异，降温后残留<\/td>\n<td>影响强度和热稳定性，须通过退火控制<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"]},{"id":18,"q":"退火窑的分区及作用","html":"<table>\n<colgroup>\n<col style=\"width: 50%\"/>\n<col style=\"width: 50%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>分区<\/th>\n<th>功能<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>加热、均热、预退火区<\/strong><\/td>\n<td>调整进入退火区的温度，提高玻璃带横向均匀性<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>A区<\/strong><\/td>\n<td>主要退火及受控降温，促进应力松弛<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>B区<\/strong><\/td>\n<td>继续控制冷却，减少新残余应力<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>C区<\/strong><\/td>\n<td><strong>热风循环强制对流冷却<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>D区<\/strong><\/td>\n<td><strong>室温空气强制对流冷却<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><p><strong><\/strong><\/p>","refs":[],"steps":["<div class=\"sequence\">加热/均热/预退火 → A区&lt;br/&gt;主要退火 → B区&lt;br/&gt;受控冷却 → C区&lt;br/&gt;热风循环冷却 → D区&lt;br/&gt;室温风冷却<\/div>","<table>\n<colgroup>\n<col style=\"width: 50%\"/>\n<col style=\"width: 50%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>分区<\/th>\n<th>功能<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>加热、均热、预退火区<\/strong><\/td>\n<td>调整进入退火区的温度，提高玻璃带横向均匀性<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>A区<\/strong><\/td>\n<td>主要退火及受控降温，促进应力松弛<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>B区<\/strong><\/td>\n<td>继续控制冷却，减少新残余应力<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>C区<\/strong><\/td>\n<td><strong>热风循环强制对流冷却<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>D区<\/strong><\/td>\n<td><strong>室温空气强制对流冷却<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"]},{"id":19,"q":"坩埚窑按火焰流动方向如何分类？","html":"<table>\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>类型<\/th>\n<th>气流组织<\/th>\n<th>优点<\/th>\n<th>缺点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>倒焰式<\/strong><\/td>\n<td>高温气体先上升，再由上向下流动、由下部排烟<\/td>\n<td>坩埚沿高度方向受热比较充分；熔制温度较均匀<\/td>\n<td>底部温度高，坩埚底部侵蚀加重<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>平焰式<\/strong><\/td>\n<td>火焰主要作水平流动<\/td>\n<td>坩埚底部温度较低，有保护作用<\/td>\n<td>高度方向温度分布可能不理想，成型操作条件受限<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>综合焰式<\/strong><\/td>\n<td>结合两种流动组织形式<\/td>\n<td>可兼顾不同阶段的加热需求<\/td>\n<td>结构和操作相对复杂<\/td>\n<\/tr>\n<\/tbody>\n<\/table><p><strong><\/strong><\/p>","refs":[],"steps":["<table>\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>类型<\/th>\n<th>气流组织<\/th>\n<th>优点<\/th>\n<th>缺点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>倒焰式<\/strong><\/td>\n<td>高温气体先上升，再由上向下流动、由下部排烟<\/td>\n<td>坩埚沿高度方向受热比较充分；熔制温度较均匀<\/td>\n<td>底部温度高，坩埚底部侵蚀加重<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>平焰式<\/strong><\/td>\n<td>火焰主要作水平流动<\/td>\n<td>坩埚底部温度较低，有保护作用<\/td>\n<td>高度方向温度分布可能不理想，成型操作条件受限<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>综合焰式<\/strong><\/td>\n<td>结合两种流动组织形式<\/td>\n<td>可兼顾不同阶段的加热需求<\/td>\n<td>结构和操作相对复杂<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"]},{"id":20,"q":"开口坩埚和闭口坩埚的区别","html":"<table>\n<thead>\n<tr class=\"header\">\n<th>项目<\/th>\n<th>开口坩埚<\/th>\n<th>闭口坩埚<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>与火焰接触<\/td>\n<td><strong>玻璃液可直接接触火焰<\/strong><\/td>\n<td><strong>玻璃液不直接接触火焰<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>传热<\/td>\n<td>较快<\/td>\n<td>通过坩埚壁间接传热，较慢<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>熔化速度与产量<\/td>\n<td>熔化较快、产量较大<\/td>\n<td>熔化较慢、产量较小<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>质量特点<\/td>\n<td>易受燃烧气氛影响<\/td>\n<td>可减少燃烧气氛污染<\/td>\n<\/tr>\n<\/tbody>\n<\/table><p><strong><\/strong><\/p>","refs":[],"steps":["<table>\n<thead>\n<tr class=\"header\">\n<th>项目<\/th>\n<th>开口坩埚<\/th>\n<th>闭口坩埚<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>与火焰接触<\/td>\n<td><strong>玻璃液可直接接触火焰<\/strong><\/td>\n<td><strong>玻璃液不直接接触火焰<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>传热<\/td>\n<td>较快<\/td>\n<td>通过坩埚壁间接传热，较慢<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>熔化速度与产量<\/td>\n<td>熔化较快、产量较大<\/td>\n<td>熔化较慢、产量较小<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>质量特点<\/td>\n<td>易受燃烧气氛影响<\/td>\n<td>可减少燃烧气氛污染<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"]},{"id":21,"q":"马蹄焰池窑的优缺点","html":"<p><strong>优点：<\/strong><\/p><ol type=\"1\">\n<li><strong>火焰路径长、热利用率较高<\/strong>：火焰在窑内U形折返，换热行程较长，燃料可较充分燃烧；火焰行程约为相应窑长的<strong>1.3～1.5倍<\/strong>。<\/li>\n<li><strong>窑型较紧凑、散热损失较少<\/strong>，结构相对简单。<\/li>\n<li>通常<strong>只需一对小炉布置在熔化池一端<\/strong>，比横火焰池窑采用多对小炉的布置容易，工程占地和建设费用相对较小。<\/li>\n<\/ol><p><strong>缺点：<\/strong><\/p><ol type=\"1\">\n<li><strong>窑内温度分布不易均匀<\/strong>，尤其宽度方向温差和火焰换向带来的波动。<\/li>\n<li><strong>窑宽与熔化规模受到火焰覆盖、小炉布置等限制<\/strong>。<\/li>\n<li>火焰可能推动料堆、影响澄清，并对局部窑体产生不利热作用。<\/li>\n<\/ol><p><strong><\/strong><\/p>","refs":[],"steps":["<p><strong>优点：<\/strong><\/p>","<div class=\"step-prose\"><div><strong>火焰路径长、热利用率较高<\/strong>：火焰在窑内U形折返，换热行程较长，燃料可较充分燃烧；火焰行程约为相应窑长的<strong>1.3～1.5倍<\/strong>。<\/div><\/div>","<div class=\"step-prose\"><div><strong>窑型较紧凑、散热损失较少<\/strong>，结构相对简单。<\/div><\/div>","<div class=\"step-prose\"><div>通常<strong>只需一对小炉布置在熔化池一端<\/strong>，比横火焰池窑采用多对小炉的布置容易，工程占地和建设费用相对较小。<\/div><\/div>","<p><strong>缺点：<\/strong><\/p>","<div class=\"step-prose\"><div><strong>窑内温度分布不易均匀<\/strong>，尤其宽度方向温差和火焰换向带来的波动。<\/div><\/div>","<div class=\"step-prose\"><div><strong>窑宽与熔化规模受到火焰覆盖、小炉布置等限制<\/strong>。<\/div><\/div>","<div class=\"step-prose\"><div>火焰可能推动料堆、影响澄清，并对局部窑体产生不利热作用。<\/div><\/div>"]},{"id":22,"q":"玻璃电熔窑的工作原理与优点","html":"<p><strong>原理：<\/strong>\n高温玻璃液具有一定电导率，通过电极使电流进入玻璃液，玻璃液的电阻产生<strong>焦耳热<\/strong>：<\/p><p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q<\/mi><mo>=<\/mo><msup><mi>I<\/mi><mn>2<\/mn><\/msup><mi>R<\/mi><mi>t<\/mi><mo>,<\/mo><mspace width=\"2.0em\"><\/mspace><mi>P<\/mi><mo>=<\/mo><msup><mi>I<\/mi><mn>2<\/mn><\/msup><mi>R<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\nQ=I^2Rt,\\qquad P=I^2R\n<\/annotation><\/semantics><\/math><\/p><p><strong>主要优点：<\/strong><\/p><ol type=\"1\">\n<li><strong>热利用率较高<\/strong>，发热介质就是玻璃液。<\/li>\n<li>适合某些<strong>高质量玻璃、含易挥发成分或深色玻璃<\/strong>。<\/li>\n<li><strong>构造可较紧凑，管理与控制方便<\/strong>。<\/li>\n<li>避免窑内直接燃料燃烧，可减少现场燃烧废气污染。<\/li>\n<\/ol><p><strong>注意：<\/strong>\n与外部电热元件加热的电阻炉不同，玻璃电熔窑是<strong>玻璃液自身导电发热<\/strong>。<strong><\/strong><\/p>","refs":[],"steps":["<p><strong>原理：<\/strong>\n高温玻璃液具有一定电导率，通过电极使电流进入玻璃液，玻璃液的电阻产生<strong>焦耳热<\/strong>：<\/p>","<p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q<\/mi><mo>=<\/mo><msup><mi>I<\/mi><mn>2<\/mn><\/msup><mi>R<\/mi><mi>t<\/mi><mo>,<\/mo><mspace width=\"2.0em\"><\/mspace><mi>P<\/mi><mo>=<\/mo><msup><mi>I<\/mi><mn>2<\/mn><\/msup><mi>R<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\nQ=I^2Rt,\\qquad P=I^2R\n<\/annotation><\/semantics><\/math><\/p>","<p><strong>主要优点：<\/strong><\/p>","<div class=\"step-prose\"><div><strong>热利用率较高<\/strong>，发热介质就是玻璃液。<\/div><\/div>","<div class=\"step-prose\"><div>适合某些<strong>高质量玻璃、含易挥发成分或深色玻璃<\/strong>。<\/div><\/div>","<div class=\"step-prose\"><div><strong>构造可较紧凑，管理与控制方便<\/strong>。<\/div><\/div>","<div class=\"step-prose\"><div>避免窑内直接燃料燃烧，可减少现场燃烧废气污染。<\/div><\/div>","<p><strong>注意：<\/strong>\n与外部电热元件加热的电阻炉不同，玻璃电熔窑是<strong>玻璃液自身导电发热<\/strong>。<strong><\/strong><\/p>"]},{"id":23,"q":"玻璃电熔窑电极材料、布置及水冷套","html":"<p><strong>常用电极材料：石墨、钼、氧化锡。<\/strong><\/p><p><strong>布置形式：水平棒状、垂直棒状、板状、塞状。<\/strong>\n水平棒状是常见形式。<\/p><p><strong>电极水冷套作用：<\/strong><\/p><ol type=\"1\">\n<li><strong>固定电极位置<\/strong>，便于推拉、调整和维护。<\/li>\n<li><strong>保护未被玻璃液覆盖的电极过渡部分<\/strong>，减少高温氧化。<\/li>\n<li><strong>避免电极附近耐火材料过热<\/strong>，减少侵蚀。<\/li>\n<li>有助于保持电极安装和供电的运行稳定性。<\/li>\n<\/ol><p><strong><\/strong><\/p>","refs":[],"steps":["<p><strong>常用电极材料：石墨、钼、氧化锡。<\/strong><\/p>","<p><strong>布置形式：水平棒状、垂直棒状、板状、塞状。<\/strong>\n水平棒状是常见形式。<\/p>","<p><strong>电极水冷套作用：<\/strong><\/p>","<div class=\"step-prose\"><div><strong>固定电极位置<\/strong>，便于推拉、调整和维护。<\/div><\/div>","<div class=\"step-prose\"><div><strong>保护未被玻璃液覆盖的电极过渡部分<\/strong>，减少高温氧化。<\/div><\/div>","<div class=\"step-prose\"><div><strong>避免电极附近耐火材料过热<\/strong>，减少侵蚀。<\/div><\/div>","<div class=\"step-prose\"><div>有助于保持电极安装和供电的运行稳定性。<\/div><\/div>"]},{"id":24,"q":"玻璃熔窑余热回收装置与作用","html":"<p><strong>典型设备：蓄热室、换热器（换热式余热回收装置）。<\/strong><\/p><p><strong>作用：<\/strong>\n利用高温烟气余热预热助燃空气或有关工艺介质，减少排烟带走的热量，提高热利用率、降低燃料消耗。<\/p><p><strong>蓄热式与换热式的区别：<\/strong>\n蓄热室通过蓄热体交替储热和放热；换热式设备通过换热壁进行热量传递。<strong><\/strong><\/p>","refs":[],"steps":["<p><strong>典型设备：蓄热室、换热器（换热式余热回收装置）。<\/strong><\/p>","<p><strong>作用：<\/strong>\n利用高温烟气余热预热助燃空气或有关工艺介质，减少排烟带走的热量，提高热利用率、降低燃料消耗。<\/p>","<p><strong>蓄热式与换热式的区别：<\/strong>\n蓄热室通过蓄热体交替储热和放热；换热式设备通过换热壁进行热量传递。<strong><\/strong><\/p>"]}],"diagrams":[{"name":"隧道窑三带与物流","kind":"sequence","nodes":["进车端","预热带","烧成带","冷却带","出车端"],"foot":"窑车由进车端到出车端；烟气向预热端排出，冷却带送风并回收热风。","src":[]},{"name":"隧道窑剖面结构标号","kind":"labels","nodes":["窑顶、窑墙、窑底","窑车车架、车轮、轨道","窑车耐火车衬","砂封、曲封","烧嘴","排烟口、烟道","冷却喷风口、抽热风口"],"foot":"训练构件名称与作用的对应关系；实际空间位置请对照或 PDF 图。","src":[]},{"name":"玻璃熔窑工艺通道","kind":"sequence","nodes":["投料端","投料池／前脸墙","熔化池","分隔装置","冷却／工作部","供料端"],"foot":"上部：碹顶、胸墙、火焰空间、小炉；下部：池壁、池底、主梁／次梁、立柱；两侧：耳池。","src":[]},{"name":"锡槽进出口设备","kind":"sequence","nodes":["流道、流槽","调节／安全／备用闸板","锡液与玻璃带","过渡辊台、密封","通向退火窑"],"foot":"槽内标注锡液、玻璃带、槽底、胸墙、顶盖、保护气体。","src":[]},{"name":"电阻炉与玻璃电熔窑","kind":"pair","nodes":["电源 → 电极 → 电流通过玻璃液 → 玻璃液内部焦耳发热","电源 → 硅碳棒／电阻丝 → 元件向炉内传热 → 工件升温"],"foot":"前者为玻璃液自身通电发热；后者由独立电热元件传热。","src":[]}],"calcs":[{"name":"面积负荷法 · 板书例题","title":"Φ100 × 800 mm 炉管设计功率","problem":"炉温 1200°C；炉管 Φ100 × 800 mm；K₁ = 18 kW/m²；安全系数 kₛ = 1.2。求设计功率。","src":[],"unit":"kW","answer":5.43,"tol":0.025,"steps":[{"t":"已知量及单位换算","f":["D = 100 mm = 0.100 m","L = 800 mm = 0.800 m","K₁ = 18 kW/m²，kₛ = 1.2"],"note":"长度由 mm 换成 m，保证 F 的单位是 m²。"},{"t":"计算炉管内侧面积","f":["F = πDL","≈ 3.14 × 0.100 × 0.800","= 0.2512 m²"],"note":"按题意，仅计算圆管内侧面积，不加端面积。"},{"t":"基本功率","f":["N₀ = K₁F","N₀ = 18 × 0.2512 = 4.5216 kW"],"note":"K₁ 是面积功率系数，不是安全系数。"},{"t":"计入安全系数","f":["Ndesign = kₛN₀","Ndesign = 1.2 × 4.5216","= 5.42592 kW ≈ 5.43 kW"],"note":"结论应包含单位：设计功率约 5.43 kW。"}]},{"name":"表面负荷法 · 例题","title":"有效绕线长度 490 mm 的炉管","problem":"炉管直径 150 mm，总长度 550 mm，有效绕线长度 490 mm，表面负荷 q = 5 W/cm²。求功率并选额定功率。","src":[],"unit":"kW","answer":11.55,"tol":0.025,"steps":[{"t":"换算单位","f":["D = 150 mm = 15 cm","Leff = 490 mm = 49 cm","q = 5 W/cm²"],"note":"不用炉管总长 550 mm，应使用有效绕线长度。"},{"t":"有效绕线区面积","f":["F = πDLeff","≈ 3.1416 × 15 × 49","= 2309.076 cm²"],"note":"因 q 以 W/cm² 计，面积需以 cm² 计。"},{"t":"计算功率","f":["N = qF","N = 5 × 2309.076 = 11545.38 W","= 11.54538 kW ≈ 11.55 kW"],"note":"W 除以 1000 换算为 kW。"},{"t":"按额定功率选型","f":["Nrated ≥ 11.55 kW","可选择 12 kW 等级"],"note":"示例采用向上选取合适标称功率。"}]},{"name":"容积负荷法 · 通用推导","title":"炉膛容积负荷法的完整求解","problem":"给出炉膛长 a、宽 b、高 h 及适用的 K₂（如题目另给安全系数 kₛ），依次求容积、基本功率与设计功率。原资料没有给定完整数值条件，因此这里只展示通用推导。","src":[],"unit":"","steps":[{"t":"求炉膛体积","f":["V = a × b × h（m³）"],"note":"长、宽、高应统一成 m。"},{"t":"计算容积的 2/3 次幂","f":["V^(2/3) = (abh)^(2/3)（m²）"],"note":"不能误写成 V²/3。"},{"t":"求基本功率","f":["N₀ = K₂V^(2/3)（kW）"],"note":"K₂ 必须根据炉型、炉温和表格选取。"},{"t":"题给安全系数时","f":["Ndesign = kₛN₀"],"note":"K₂ 不是安全系数；未给 K₂ 不能臆造数值。"}]},{"name":"元件老化 · 定电压关系","title":"硅碳棒老化后的功率与补偿","problem":"在电压保持不变的条件下讨论电阻增大后的功率；若电阻成为初始的 k 倍，推导功率和恢复功率所需电压。","src":[],"unit":"","steps":[{"t":"固定电压下功率式","f":["P₁ = U₁²/R₁","P₂ = U₁²/R₂"],"note":"这里相同的 U₁ 表示老化前后供电电压不变。"},{"t":"功率之比","f":["P₂/P₁ = R₁/R₂"],"note":"定电压时电阻越大，功率越小。"},{"t":"电阻变为 k 倍","f":["R₂ = kR₁","P₂ = P₁/k"],"note":"此处 k 为电阻变化倍数。"},{"t":"恢复原功率","f":["U₂²/(kR₁) = U₁²/R₁","U₂² = kU₁²","U₂ = U₁√k"],"note":"实际调压必须符合额定电压、电流和表面负荷限制。"}]},{"name":"必背公式 · 逐个揭晓","title":"电学和热工常用公式","problem":"按资料第 11 页公式表，依次回忆欧姆定律、电功率、焦耳热、电阻率、温度系数、圆管面积与电阻炉功率法。","src":[],"unit":"","steps":[{"t":"欧姆定律","f":["I = U/R"],"note":"I（A）、U（V）、R（Ω）。"},{"t":"电功率","f":["P = UI = I²R = U²/R"],"note":"P 的单位 W。"},{"t":"焦耳热","f":["Q = I²Rt = Pt"],"note":"t 用 s，Q 用 J。"},{"t":"电阻率与温度系数","f":["R = ρL/A","α = (1/R)·dR/dT"],"note":"α < 0 为升温电阻下降，α > 0 为上升。"},{"t":"面积与经验功率","f":["F = πDL","N = K₁F","N = K₂V^(2/3)"],"note":"K₁、K₂ 根据各自方法和课程表格选取。"},{"t":"设计功率","f":["Ndesign = kₛN₀"],"note":"安全系数仅在题给条件下使用。"}]}],"wrong":[{"q":"隧道窑的三带与冷却带的三段","a":"三带：预热、烧成、冷却；冷却带三段：急冷、缓冷、快冷"},{"q":"隧道窑与梭式窑","a":"前者连续，后者间歇"},{"q":"隧道窑与辊道窑","a":"前者窑车承载，后者辊棒输送"},{"q":"硅碳棒的电阻率与电阻温度系数","a":"电阻率可先减后增，温度系数是变化率，不是同一个量"},{"q":"硅碳棒与玻璃电熔窑电极","a":"硅碳棒作为独立发热元件；电极使玻璃液自身通电发热"},{"q":"退火点与应变点","a":"退火点应力松弛较快；应变点松弛较慢"},{"q":"暂时应力与永久应力","a":"暂时应力随温差可消失；永久应力可能在温度均匀后保留"},{"q":"玻璃熔窑与锡槽与退火窑","a":"熔制 → 成型 → 消除残余应力"},{"q":"马蹄焰池窑与横火焰池窑","a":"火焰折返 U 形与多对小炉横向供火的结构差别"},{"q":"分隔装置与耳池","a":"前者调节区段分隔和流动；后者促进横向对流、澄清与回流"},{"q":"N = K₁F 与 N = K₂V^(2/3)","a":"一个使用面积，一个使用容积的 2/3 次幂"},{"q":"玻璃自由厚度与成品厚度","a":"自由厚度约 7 mm；实际产品厚度取决于拉引和成型制度"}],"checks":["隧道窑三带名称、各自作用和工艺要求","隧道窑工作流程及示意图标号","现代隧道窑的发展趋势","现代隧道窑减小上下温差的五项措施","急冷/缓冷/快冷的温度、设置方式、目的","平顶相对于拱顶的三项优势","隧道窑与辊道窑的优缺点","梭式窑的结构、运行方式和适用特点","电阻炉三个公式：Q = I²Rt、N = K₁F、N = K₂V^(2/3)","硅碳棒电阻率曲线、1450°C、老化与功率补偿","炉管 Φ100×800 mm 计算题完整步骤","玻璃熔制五阶段","投料池、前脸墙、分隔装置、耳池的作用","温度制度、液面、泡界线及窑压","浮法成型原理、自由厚度、保护气氛","锡槽进口闸板、出口过渡辊台及前宽后窄结构","退火的目的、上下限、应力类型、退火区段","坩埚窑倒焰式/平焰式与开口/闭口的优缺点","马蹄焰池窑优缺点","玻璃电熔窑电极材料、布置形式与水冷套作用"],"sources":[],"slides":{},"version":"2026.11.16"};const PRIVATE=false;</script><script>(()=>{'use strict';

function header(title,desc){let v=$('content');v.replaceChildren();$('pageTitle').textContent=title;$('pageLead').textContent=desc;return v}
function filterPanel(placeholder,hasType=true){let w=el('div','toolbar');const input=el('input','control search');input.type='search';input.value=state.search;input.placeholder=placeholder;input.setAttribute('aria-label',placeholder);input.addEventListener('input',e=>{state.search=e.target.value;state.page=0;renderContent()});w.append(input);if(hasType){let s=el('select','control');[['all','全部'],['todo','待复习'],['done','已掌握']].forEach(([v,t])=>{let opt=el('option','',t);opt.value=v;s.append(opt)});s.value=state.type;s.onchange=()=>{state.type=s.value;state.page=0;renderContent()};w.append(s)}return w}
function filtered(a,type){return a.filter(x=>(!state.search||(x.q+' '+(x.a||'')+' '+(x.html||'').replace(/<[^>]+>/g,' ')).toLowerCase().includes(state.search.toLowerCase()))&&(state.type==='all'||(state.type==='done')===!!state.done[key(type,x.id)]))}
function pager(root,total){const pages=Math.ceil(total/LIMIT);if(pages<2)return;const bar=el('div','pager'),p=el('span','',`${state.page+1} / ${pages} 页 · ${total} 条`);bar.append(nbtn('上一页','',()=>{state.page=Math.max(0,state.page-1);renderContent();window.scrollTo({top:170,behavior:'smooth'})}));bar.append(p);bar.append(nbtn('下一页','',()=>{state.page=Math.min(pages-1,state.page+1);renderContent();window.scrollTo({top:170,behavior:'smooth'})}));root.append(bar)}
function questionShell(q,source,index,meta=''){let card=el('article','item');card.append(el('div','eyeline','<span class="meta">'+String(index+1).padStart(2,'0')+'</span>'));card.append(el('div','qtitle',esc(q)));card.append(sourceBtn(source,meta));return card}
function home(){let root=$('items');root.replaceChildren();let p=el('div','overview');p.append(el('p','small-label','COURSE CONTENTS'));const rows=[['rapid','填空速记','58 个核心考点'],['definitions','名词解释','24 个概念'],['ceramic','陶瓷简答','11 道综合题'],['glass','玻璃简答','24 道综合题'],['diagrams','识图与流程','5 组示意训练'],['calcs','计算与公式','5 组分步推导'],['review','易错与自查','12 组辨析 · 20 项考前清单']];rows.forEach(([id,t,sub],i)=>{let row=el('div','overview-row','<div><b>'+esc(t)+'</b><p>'+esc(sub)+'</p></div>');row.append(nbtn('开始 →','',()=>changeSection(id)));p.append(row)});root.append(p);sourceRail([])}
function quizRapid(){let root=$('items');root.replaceChildren();let arr=filtered(D.rapid,'rapid');if(!arr.length){root.append(el('p','muted','没有匹配的题目。'));return}arr.slice(state.page*LIMIT,(state.page+1)*LIMIT).forEach((x,i)=>{const id=key('rapid',x.id);let card=questionShell(x.q,x.refs,i+state.page*LIMIT,x.source||x.html);let wrap=el('div','');let blank=nbtn(state.guess[id]===undefined?'点击填空':state.guess[id],'blank'+(state.guess[id]!==undefined?' answered':''),()=>{choices.hidden=!choices.hidden});blank.setAttribute('aria-label','选择填空答案');wrap.append(blank);const choices=el('div','choices');choices.hidden=true;let distract=D.rapid.filter(t=>t.id!==x.id&&t.kind===x.kind).map(t=>t.a);let h=(x.id*13)%Math.max(1,distract.length);let opts=[x.a];[0,11,24].forEach(o=>opts.push(distract[(h+o)%distract.length]));opts=[...new Set(opts)].sort((a,b)=>((a.charCodeAt(0)+x.id*7)%13)-((b.charCodeAt(0)+x.id*7)%13));opts.forEach(o=>choices.append(nbtn(o,'',()=>{state.guess[id]=o;choices.hidden=true;renderContent()})));wrap.append(choices);card.append(wrap);if(state.guess[id]!==undefined){let correct=state.guess[id]===x.a;blank.classList.toggle('wrong',!correct);card.append(el('div','feedback '+(correct?'good':'bad'),correct?'回答正确。':'还不对，可以继续选择或查看答案。'));if(correct&&!state.done[id]){state.done[id]=true;save();updateNav()}}let actions=el('div','item-actions');actions.append(nbtn('查看答案','flat',()=>{state.guess[id]=x.a;state.done[id]=true;save();updateNav();renderContent()}));actions.append(nbtn(state.done[id]?'✓ 已掌握':'标记掌握',state.done[id]?'primary':'',()=>{mark('rapid',x.id,!state.done[id]);renderContent()}));card.append(actions);root.append(card)});pager(root,arr.length);sourceRail(arr[0]?.refs,arr[0]?.source)}
function answerBlock(html){let box=el('div','answer-pane');box.innerHTML=html;return box}
function longQuestions(type){let root=$('items');root.replaceChildren();const a=filtered(list(type),type);if(!a.length){root.append(el('p','muted','没有匹配的题目。'));return}a.slice(state.page*LIMIT,(state.page+1)*LIMIT).forEach((x,i)=>{let id=key(type,x.id),card=questionShell(x.q,x.refs,i+state.page*LIMIT,x.source||x.html);let total=type==='definitions'?1:x.steps.length;let shown=state.step[id]||0;let answer=el('div','');if(shown){let content=type==='definitions'?[x.html]:x.steps;content.slice(0,shown).forEach((step,j)=>{let box=answerBlock(step);box.classList.add('reveal-step');answer.append(box)})}card.append(answer);const bar=el('div','item-actions');bar.append(el('span','step-count',`${shown} / ${total}`));bar.append(nbtn(shown>=total?'已全部展开':'下一条 →','primary',()=>{state.step[id]=Math.min(total,shown+1);renderContent()}));bar.append(nbtn('展开全部','flat',()=>{state.step[id]=total;renderContent()}));if(shown)bar.append(nbtn('收起','flat',()=>{state.step[id]=0;renderContent()}));card.append(bar);card.append(markButtons(type,x.id));root.append(card)});pager(root,a.length);sourceRail(a[0]?.refs,a[0]?.html)}
function diagramsView(){let root=$('items');root.replaceChildren();const selector=el('div','toolbar');D.diagrams.forEach((d,i)=>selector.append(nbtn((i+1)+' · '+d.name,(state.active===i?'primary':''),()=>{state.active=i;renderContent()})));root.append(selector);const d=D.diagrams[state.active],id='diagram:'+state.active,shown=state.step[id]||0;let card=questionShell(d.name,d.src,state.active);let flow=el('div','diagram-flow');d.nodes.forEach((a,i)=>{if(i)flow.append(el('span','arrow','→'));flow.append(el('div','node '+(i<shown?'visible':''),i<shown?esc(a):'？'))});card.append(flow);card.append(el('div','minor',esc(d.foot)));const bar=el('div','item-actions');bar.append(el('span','step-count',shown+' / '+d.nodes.length));bar.append(nbtn('上一步','',()=>{state.step[id]=Math.max(0,shown-1);renderContent()}));bar.append(nbtn('下一步 →','primary',()=>{state.step[id]=Math.min(shown+1,d.nodes.length);renderContent()}));bar.append(nbtn('全部显示','flat',()=>{state.step[id]=d.nodes.length;renderContent()}));bar.append(nbtn('重新开始','flat',()=>{state.step[id]=0;renderContent()}));card.append(bar);root.append(card);sourceRail(d.src)}
function flatCalcSteps(c){let out=[];c.steps.forEach((s,i)=>{out.push({kind:'label',text:s.t});(s.f||[]).forEach(line=>out.push({kind:'math',text:line}));if(s.note)out.push({kind:'note',text:s.note})});return out}
function calcView(){let root=$('items');root.replaceChildren();let sel=el('div','toolbar');D.calcs.forEach((c,i)=>sel.append(nbtn(c.name,i===state.active?'primary':'',()=>{state.active=i;renderContent()})));root.append(sel);let c=D.calcs[state.active],id='calc:'+state.active,steps=flatCalcSteps(c),shown=state.step[id]||0;const card=questionShell(c.title,c.src,state.active,c.src);card.append(el('p','',esc(c.problem)));const formula=el('div','formula-section');if(!shown)formula.append(el('p','muted','点击下一步，逐行展开公式与推导。'));steps.slice(0,shown).forEach((s,i)=>{if(s.kind==='label')formula.append(el('div','small-label reveal-step',esc(s.text)));else if(s.kind==='math')formula.append(el('div','calc-equation reveal-step',esc(s.text)));else formula.append(el('div','minor reveal-step',esc(s.text)))});card.append(formula);let actions=el('div','item-actions');actions.append(el('span','step-count',shown+' / '+steps.length));actions.append(nbtn('← 上一步','',()=>{state.step[id]=Math.max(0,shown-1);renderContent()}));actions.append(nbtn('下一步 →','primary',()=>{state.step[id]=Math.min(steps.length,shown+1);renderContent()}));actions.append(nbtn('展开全部','flat',()=>{state.step[id]=steps.length;renderContent()}));actions.append(nbtn('重来','flat',()=>{state.step[id]=0;renderContent()}));card.append(actions);if(c.answer!==null&&c.answer!==undefined){const row=el('div','formula-section');row.append(el('p','small-label','FINAL ANSWER'));let input=el('input','input-answer');input.type='text';input.inputMode='decimal';input.placeholder='输入数值';input.setAttribute('aria-label','最终结果');let fb=el('span','feedback');row.append(input);row.append(document.createTextNode(' '+(c.unit||'')+' '));row.append(nbtn('检查','',()=>{let v=Number(input.value.trim().replace(',','.'));let good=input.value.trim()!==''&&Number.isFinite(v)&&Math.abs(v-c.answer)<=(c.tol??0.05);fb.textContent=good?'数值正确。':'再检查单位、计算过程或舍入。';fb.className='feedback '+(good?'good':'bad')}));row.append(fb);card.append(row)}root.append(card);sourceRail(c.src,c.src)}
function reviewView(){let root=$('items');root.replaceChildren();let sel=el('div','toolbar');sel.append(nbtn('易错辨析',state.active===0?'primary':'',()=>{state.active=0;renderContent()}));sel.append(nbtn('考前清单',state.active===1?'primary':'',()=>{state.active=1;renderContent()}));root.append(sel);if(state.active===0){D.wrong.forEach((x,i)=>{let card=questionShell(x.q,[],i);let id='wrong:'+i,visible=!!state.revealed[id];if(visible)card.append(answerBlock('<p>'+esc(x.a)+'</p>'));card.append(nbtn(visible?'收起答案':'显示答案 →','',()=>{state.revealed[id]=!visible;renderContent()}));root.append(card)})}else{let checked=D.checks.filter((_,i)=>state.checks[i]).length;root.append(el('p','minor','已完成 '+checked+' / '+D.checks.length));D.checks.forEach((x,i)=>{let row=el('div','check '+(state.checks[i]?'checked':''));let inp=document.createElement('input');inp.type='checkbox';inp.checked=!!state.checks[i];inp.id='check-'+i;inp.addEventListener('change',e=>{state.checks[i]=e.target.checked;save();renderContent()});row.append(inp);let l=el('label','',esc(x));l.setAttribute('for',inp.id);row.append(l);root.append(row)})}sourceRail([])}
function sourcesView(){changeSection('home');}
function renderContent(){let r=$('items');if(!r)return;r.replaceChildren();if(state.section==='home')home();else if(state.section==='rapid')quizRapid();else if(['definitions','ceramic','glass'].includes(state.section))longQuestions(state.section);else if(state.section==='diagrams')diagramsView();else if(state.section==='calcs')calcView();else if(state.section==='review')reviewView();else sourcesView()}
function render(){const [t,d]=TITLES[state.section];header(t,d);if(['rapid','definitions','ceramic','glass'].includes(state.section)){const c=$('content');c.append(filterPanel('搜索题目、答案…'));}const it=el('div','');it.id='items';$('content').append(it);renderContent()}
function openSlide(id,requestedPage=null){if(!PRIVATE||!D.slides?.[id]?.length){toast('原课件页面仅在个人离线版提供');return;}state.slide={id,index:Math.max(0,D.slides[id].findIndex(x=>x.page===requestedPage))};refreshSlide();$('modal').hidden=false;document.body.style.overflow='hidden'}
function closeSlide(){$('modal').hidden=true;document.body.style.overflow='';state.slide=null}
function refreshSlide(){if(!state.slide)return;let {id,index}=state.slide;let imgs=D.slides[id];index=Math.min(Math.max(index,0),imgs.length-1);state.slide.index=index;const it=imgs[index];$('slideImage').src=it.file;$('slideTitle').textContent=id+' · 课件第 '+it.page+' 页';$('slideNumber').textContent=(index+1)+' / '+imgs.length;$('slidePrev').disabled=index===0;$('slideNext').disabled=index===imgs.length-1}
$('modalClose').onclick=closeSlide;$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSlide()});$('slidePrev').onclick=()=>{state.slide.index--;refreshSlide()};$('slideNext').onclick=()=>{state.slide.index++;refreshSlide()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').hidden)closeSlide();else if(state.slide&&e.key==='ArrowRight'){state.slide.index++;refreshSlide()}else if(state.slide&&e.key==='ArrowLeft'){state.slide.index--;refreshSlide()}});
$('resetButton').onclick=()=>{if(confirm('清除本浏览器保存的全部掌握与自查记录？')){state.done={};state.checks={};save();render();updateNav()}};
$('exportButton').onclick=()=>{let blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),version:D.version,done:state.done,checks:state.checks},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='thermal-review-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};
$('importInput').addEventListener('change',async(e)=>{let f=e.target.files?.[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(obj.done&&obj.checks){state.done=obj.done;state.checks=obj.checks;save();render();updateNav();toast('进度已导入')}else throw new Error('invalid')}catch(_){toast('不是有效的学习记录文件')}e.target.value=''});
$('importButton').onclick=()=>$('importInput').click();
$('mobileExport').onclick=()=>$('exportButton').click();$('mobileImport').onclick=()=>$('importButton').click();$('mobileReset').onclick=()=>$('resetButton').click();

})();</script><script>document.getElementById('brandHome').addEventListener('click',e=>{e.preventDefault();document.querySelector('#nav button')?.click()})</script></body></html>
